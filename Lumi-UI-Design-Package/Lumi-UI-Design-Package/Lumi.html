names.mobile='Giới thiệu app';
const onboardingSlides=[{eyebrow:'CHÀO BẠN, MÌNH LÀ LUMI',title:'Một góc nhỏ.<br>Nhiều điều để hiểu.',copy:'Mang tài liệu của bạn đến. Mình cùng đọc, cùng hỏi và tìm hiểu từng chút.',icon:'book',kind:'learn'},{eyebrow:'ĐIỀU CHƯA RÕ, CỨ HỎI',title:'Đọc một đoạn.<br>Hiểu thêm một ý.',copy:'Một lời giải thích dễ hiểu, một ví dụ gần gũi và vị trí nguồn để bạn xem lại.',icon:'spark',kind:'ask'},{eyebrow:'THEO NHỊP HỌC CỦA BẠN',title:'Nhớ thêm chút nữa.<br>Nhẹ nhàng thôi.',copy:'Ghi chú, thử câu hỏi hoặc ôn flashcard khi thấy phù hợp. Không cần dùng mọi công cụ.',icon:'sprout',kind:'review'}];
function onboardingArt(kind){if(kind==='ask')return `<div class="on-art on-art-chat"><div class="on-art-source">${icon('file')}Bài giảng của mình<span>Trang 12</span></div><div class="on-art-question">Cho mình một ví dụ nhé?</div><div class="on-art-answer">${icon('spark')}<p>Hãy hình dung khóa ngoại<br>như một chiếc cầu nối…</p><span>${icon('link')}Mở lại nguồn</span></div><div class="on-art-sticker">${icon('check')}À, ra vậy!</div></div>`;if(kind==='review')return `<div class="on-art on-art-review"><div class="on-back-card"></div><div class="on-front-card"><span>THỬ NHỚ MỘT CHÚT</span>${icon('spark')}<strong>Khóa chính có<br>chứa NULL không?</strong><small>Chạm, lật và hiểu thêm.</small></div><div class="on-art-sticker">${icon('sprout')}Mỗi người một nhịp.</div></div>`;return `<div class="on-art on-art-learn"><div class="on-document"><small>LUMI / LEARNING</small>${icon('book')}<strong>Điều mình<br>muốn tìm hiểu.</strong><i></i><i></i><span>MỘT TÀI LIỆU LÀ ĐỦ.</span></div><div class="on-art-note">${icon('note')}Giữ lại một ý hay.</div><div class="on-art-sticker">${icon('spark')}Mình học cùng bạn.</div></div>`}
function mobileWelcomePage(){let slide=onboardingSlides[onboardingIndex];return `<div class="mobile-preview-stage"><header class="mobile-preview-toolbar"><a href="#landing">${icon('back')}Trang giới thiệu web</a>${userThemeControl('màn chào app')}</header><section class="mobile-welcome-frame"><div class="mobile-welcome-paper"><div class="mobile-status"><span>9:41</span><span>● ▰</span></div><div class="mobile-welcome-top"><a href="#mobile" class="l-brand">${lBrand()}</a><button onclick="startMobileAccount('login')">Bỏ qua</button></div><div class="onboarding-visual">${onboardingArt(slide.kind)}</div><div class="onboarding-copy"><span>${slide.eyebrow}</span><h1>${slide.title}</h1><p>${slide.copy}</p></div><div class="onboarding-dots" role="tablist" aria-label="Các màn giới thiệu app">${onboardingSlides.map((_,i)=>`<button role="tab" aria-label="Màn giới thiệu ${i+1}" aria-selected="${i===onboardingIndex}" class="${i===onboardingIndex?'active':''}" onclick="onboardingIndex=${i};render()"></button>`).join('')}</div><div class="onboarding-actions">${onboardingIndex<2?`<button class="account-primary" onclick="onboardingIndex++;render()">Tiếp tục ${icon('arrow')}</button>`:`<button class="account-primary" onclick="startMobileAccount('signup')">Bắt đầu cùng Lumi ${icon('arrow')}</button>`}<button class="onboarding-login" onclick="startMobileAccount('login')">Đã có tài khoản? <strong>Đăng nhập</strong></button></div><div class="mobile-home-indicator"></div></div></section><p class="mobile-preview-caption">Màn chào → đăng nhập/đăng ký → không gian học mobile.<br>Đây là giao diện chạy trên trình duyệt, chưa phải APK hay ứng dụng trên cửa hàng.</p></div>`}
function openLumiMobile(){mobileFlow=true;onboardingIndex=0;setMode('mobile');go('mobile')}
function startMobileAccount(mode){setMode('mobile');pendingLumiRoute='home';authMode=mode;go('auth')}
tryLumiMobile=function(){openLumiMobile()};
function accountField(label,id,type,placeholder,ic,autocomplete=''){return `<label class="account-label" for="${id}">${label}</label><div class="account-field">${icon(ic)}<input id="${id}" type="${type}" placeholder="${placeholder}" required ${autocomplete?`autocomplete="${autocomplete}"`:''} oninput="clearAccountError()" ${type==='password'?'minlength="6"':''}>${type==='password'?`<button type="button" class="account-show-password" aria-label="Hiện mật khẩu" aria-pressed="false" onclick="toggleAccountPassword('${id}',this)">Hiện</button>`:''}</div>`}
function accountForm(){const login=authMode==='login',reset=authMode==='reset';return `<div class="account-form-heading"><span class="account-eyebrow">${reset?'KHÔI PHỤC TÀI KHOẢN':login?'KHÔNG GIAN HỌC CỦA BẠN':'BẮT ĐẦU HÀNH TRÌNH MỚI'}</span><h1>${reset?'Lấy lại mật khẩu':login?'Đăng nhập Lumi':'Tạo tài khoản Lumi'}</h1><p>${reset?'Nhập email để tiếp tục luồng khôi phục mẫu.':login?'Tiếp tục từ điều bạn đang tìm hiểu.':'Giữ học liệu, ý tưởng và tiến độ trong một không gian.'}</p></div>${!reset?`<div class="account-mode-tabs" aria-label="Chọn thao tác tài khoản"><button class="${login?'active':''}" onclick="authMode='login';render()">Đăng nhập</button><button class="${!login?'active':''}" onclick="authMode='signup';render()">Đăng ký</button></div>`:''}<form class="account-form" onsubmit="event.preventDefault();submitAuth()" novalidate>${!login&&!reset?accountField('Tên của bạn','authName','text','Mình nên gọi bạn là gì?','user','name'):''}${accountField('Email','authEmail','email','ban@example.com','mail','email')}${!reset?accountField('Mật khẩu','authPassword','password',login?'Nhập mật khẩu thử nghiệm':'Tạo mật khẩu từ 8 ký tự','lock',login?'current-password':'new-password'):''}${!login&&!reset?`<span class="account-password-hint">Tối thiểu 8 ký tự · Chỉ dùng mật khẩu để thử giao diện.</span>${accountField('Nhập lại mật khẩu','authPasswordConfirm','password','Nhập lại mật khẩu vừa tạo','lock','new-password')}<label class="account-consent"><input id="authAgreement" type="checkbox"><span>Mình hiểu đây là tài khoản mô phỏng trong bản trải nghiệm Lumi.</span></label>`:''}${login?`<div class="account-form-meta"><button type="button" onclick="authMode='reset';render()">Quên mật khẩu?</button></div>`:''}<div id="accountError" class="account-error" role="alert" hidden></div><button class="account-primary" type="submit">${reset?'Tiếp tục':login?'Đăng nhập':'Tạo tài khoản'}${icon('arrow')}</button></form>${login?`<div class="account-demo-divider"><span>BẠN MUỐN XEM THỬ?</span></div><button class="account-demo-button" onclick="fillLumiDemo()">${icon('play')}Dùng thông tin mẫu ${icon('arrow')}</button>`:''}${reset?`<button class="account-reset-back" onclick="authMode='login';render()">${icon('back')}Quay lại đăng nhập</button>`:''}<p class="account-demo-notice">${icon('info')}Bản trải nghiệm giao diện. Không sử dụng mật khẩu thật.</p>`}
function accountStory(){return `<section class="account-story"><a class="l-brand" href="#landing">${lBrand()}</a><div><span class="account-story-kicker">HỌC THEO NHỊP CỦA BẠN</span><h2>Một câu hỏi mới.<br>Một chút<br><em>hiểu thêm.</em></h2><p>Đưa tài liệu đến Lumi.<br>Mình cùng đi từ “chưa hiểu” đến “à, ra vậy”.</p><div class="account-story-cards"><div class="account-story-source">${icon('file')}<span><strong>Bài giảng của mình</strong><small>Kiến thức bắt đầu từ đây.</small></span>${icon('check')}</div><div class="account-story-answer"><span>${icon('spark')}LUMI</span><p>Mình thử nhìn điều này<br>qua một ví dụ nhé?</p><small>${icon('link')}Có nguồn để xem lại.</small></div></div></div><div class="account-story-footer">${icon('sprout')}Không cần vội. Mỗi chút đều có ý nghĩa.</div></section>`}
authPage=function(){const compact=mobileFlow||Boolean(typeof window.matchMedia==='function'&&window.matchMedia('(max-width: 600px)').matches);return compact?`<div class="mobile-account-stage"><header class="mobile-preview-toolbar"><button onclick="${mobileFlow?"go('mobile')":"go('landing')"}">${icon('back')}${mobileFlow?'Màn chào app':'Trang giới thiệu'}</button>${userThemeControl('tài khoản')}</header><section class="mobile-account-frame"><div class="mobile-status"><span>9:41</span><span>● ▰</span></div><div class="mobile-account-brand"><span class="l-logo">${icon('leaf')}</span>Lumi<span>.</span></div><div class="mobile-account-content">${accountForm()}</div><div class="mobile-home-indicator"></div></section></div>`:`<div class="account-web"><header class="account-web-header"><a class="l-brand" href="#landing">${lBrand()}</a><button onclick="go('landing')">${icon('back')}Trang giới thiệu</button><button class="account-mobile-link" onclick="openLumiMobile()">Mở app mobile ${icon('arrow')}</button>${userThemeControl('tài khoản')}</header><div class="account-web-layout">${accountStory()}<section class="account-form-panel">${accountForm()}</section></div><footer class="account-web-footer"><span>Lumi · Học nhẹ nhàng, hiểu sâu hơn.</span><button onclick="go('landing')">Tìm hiểu về Lumi ${icon('arrow')}</button></footer></div>`};
function accountError(text,id){const el=$('accountError');if(el){el.textContent=text;el.hidden=false}if(id)$(id)?.focus()}
function clearAccountError(){const el=$('accountError');if(el){el.hidden=true;el.textContent=''}}
function toggleAccountPassword(id,button){const field=$(id);if(!field)return;const reveal=field.type==='password';field.type=reveal?'text':'password';button.textContent=reveal?'Ẩn':'Hiện';button.setAttribute('aria-pressed',String(reveal));button.setAttribute('aria-label',reveal?'Ẩn mật khẩu':'Hiện mật khẩu')}
const accountOriginalSubmit=submitAuth;
submitAuth=function(){clearAccountError();const email=$('authEmail')?.value.trim()||'';if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){accountError('Bạn nhập một địa chỉ email hợp lệ nhé.','authEmail');return}if(authMode!=='reset'){const password=$('authPassword')?.value||'';if(password.length<(authMode==='signup'?8:6)){accountError(authMode==='signup'?'Mật khẩu thử nghiệm cần ít nhất 8 ký tự.':'Mật khẩu thử nghiệm cần ít nhất 6 ký tự.','authPassword');return}if(authMode==='signup'){if(!$('authName')?.value.trim()){accountError('Cho Lumi biết tên bạn nhé.','authName');return}if(password!==$('authPasswordConfirm')?.value){accountError('Hai mật khẩu chưa giống nhau. Bạn kiểm tra lại nhé.','authPasswordConfirm');return}if(!$('authAgreement')?.checked){accountError('Bạn xác nhận đã hiểu đây là bản trải nghiệm nhé.','authAgreement');return}}}accountOriginalSubmit()};
const accountOriginalEnter=enterLumi;
enterLumi=function(mode){if(page==='landing'){setMode('desktop');mobileFlow=false}accountOriginalEnter(mode)};
const accountOriginalGo=go;
go=function(p){if(p==='mobile'){setMode('mobile');page='mobile';lumiGuestMenu=false;setLumiEntry('public');if(location.hash!=='#mobile')history.pushState({lumiPage:'mobile'},'','#mobile');render();window.scrollTo({top:0,behavior:'instant'});return}accountOriginalGo(p)};
const accountOriginalRender=render;
render=function(){if(page==='mobile'){document.documentElement.dataset.surface='mobile-intro';setLumiEntry('public');$('publicRoot').innerHTML=mobileWelcomePage();document.title='Lumi — App mobile';if(typeof playLumiMotion==='function')playLumiMotion(document.querySelector('.onboarding-copy'),[{opacity:.5,transform:'translateY(8px)'},{opacity:1,transform:'translateY(0)'}],{duration:300});return}document.documentElement.dataset.surface=page==='landing'?'landing':page==='auth'?'account':'app';if(page==='auth'){setLumiEntry('public');$('publicRoot').innerHTML=authPage();document.title='Lumi — '+(authMode==='signup'?'Đăng ký':authMode==='reset'?'Khôi phục mật khẩu':'Đăng nhập');if(typeof installLumiMotion==='function')installLumiMotion();return}accountOriginalRender()};
// Explicit mobile entry from the public brochure, rather than just a phone illustration.
const accountOriginalLanding=landingPage;
landingPage=function(){return accountOriginalLanding().replace('<div class="l-nav-actions">',`<div class="l-nav-actions"><button class="public-theme-trigger" aria-label="Chọn giao diện sáng, tối hoặc dịu mắt" title="Chọn giao diện" onclick="openAppearance()">${icon('palette')}</button><button class="account-mobile-launch" onclick="openLumiMobile()">${icon('play')}App mobile</button>`).replace('Thử bố cục điện thoại','Mở bản app mobile')};
function userThemeControl(context='Lumi'){return `<label class="user-theme-control"><span>${icon('palette')}Giao diện</span><select class="user-theme-select" aria-label="Chọn giao diện ${context}" onchange="setTheme(this.value)">${[['light','Sáng'],['dark','Tối'],['comfort','Dịu mắt']].map(([v,t])=>`<option value="${v}" ${currentTheme===v?'selected':''}>${t}</option>`).join('')}</select></label>`}
const userThemeOriginal=setTheme;
setTheme=function(theme){userThemeOriginal(theme);document.querySelectorAll('.user-theme-select').forEach(el=>el.value=currentTheme)};
if(mobileFlow)accountOriginalMode('mobile');
if(location.hash==='#mobile')go('mobile');else render();

</script><script>(function(){const q=new URLSearchParams(location.search);const layout=q.get('layout');if(layout==='mobile'||layout==='desktop')setMode(layout);const theme=q.get('theme');if(['light','dark','comfort'].includes(theme))setTheme(theme);const screen=q.get('screen');if(screen&&(Object.hasOwn(names,screen)||screen==='landing'))go(screen)})();</script></body></html>
