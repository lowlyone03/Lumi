name: Build Lumi Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Generate Wrapper and Build APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.5
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../build.log || (echo "### ❌ Build Error" >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && tail -n 120 ../build.log >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && exit 1)

      - name: Rename and Prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Lumi-AI.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-Android-APK
          path: Lumi-AI.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-apk
          name: "Lumi AI Android App v1.0.0"
          body: |
            ### 🌿 Bản cài đặt ứng dụng di động Lumi AI (Android APK)
            - **Dành cho:** Điện thoại Android (OPPO A92, Samsung, Xiaomi...)
            - **Tải về:** Bấm vào tệp `Lumi-AI.apk` bên dưới để tải trực tiếp về điện thoại và bấm **Cài đặt**.
          files: Lumi-AI.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
