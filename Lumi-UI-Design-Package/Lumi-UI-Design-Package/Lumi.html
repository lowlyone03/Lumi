function library(){let all=[...courses,...extraCourses];let filtered=all.map((c,i)=>({c,i})).filter(x=>!searchTerm||x.c.title.toLowerCase().includes(searchTerm.toLowerCase()));let content=tab==='courses'?'<div class="librarygrid">'+filtered.map(x=>courseCard(x.c,x.i)).join('')+'</div>':tab==='sources'?sourceRows():tab==='notes'?'<div class="settingcard"><span class="badge green">Cơ sở dữ liệu · Trang 12</span><h2 style="font-size:15px">Khóa và ràng buộc</h2><p style="white-space:pre-wrap">'+esc(note)+'</p><button class="btn ghost" onclick="readerTab=\'notes\';go(\'reader\')">Mở ghi chú '+icon('arrow')+'</button></div>':'<div class="settingcard"><span class="badge green">3 câu · Không giới hạn thời gian</span><h2 style="font-size:17px">Khóa và ràng buộc dữ liệu</h2><p>Thử một vài câu hỏi để xem phần nào bạn muốn tìm hiểu thêm.</p><button class="btn" onclick="startQuiz()">Luyện tập khi sẵn sàng '+icon('arrow')+'</button></div>';return '<div class="pagehead"><div><div class="eyebrow" style="margin-bottom:9px">Gom những điều bạn muốn hiểu</div><h1>Góc học tập</h1><p>Học liệu, ý tưởng và hành trình của riêng bạn.</p></div><button class="btn" onclick="openUpload()">'+icon('plus')+'Thêm học liệu</button></div><div class="searchbox" style="display:flex;width:100%;max-width:440px;margin-bottom:18px"><span>'+icon('search')+'</span><input aria-label="Tìm trong góc học tập" placeholder="Tìm khóa học hoặc học liệu..." value="'+esc(searchTerm)+'" oninput="searchTerm=this.value;renderLibraryResults()"></div><div class="tabs">'+[['courses','Khóa học'],['sources','Học liệu'],['notes','Ghi chú'],['practice','Luyện tập']].map(([k,v])=>'<button class="'+(tab===k?'active':'')+'" onclick="tab=\''+k+'\';render()">'+v+'</button>').join('')+'</div><div id="libraryResults">'+content+'</div>'+footer()}
function renderLibraryResults(){let all=[...courses,...extraCourses];let h=tab==='courses'?'<div class="librarygrid">'+all.map((c,i)=>({c,i})).filter(x=>x.c.title.toLowerCase().includes(searchTerm.toLowerCase())).map(x=>courseCard(x.c,x.i)).join('')+'</div>':tab==='sources'?sourceRows():null;if(h!==null)document.getElementById('libraryResults').innerHTML=h}
function search(s){searchTerm=s;tab='sources';go('library')}function openSource(type){if(type==='VIDEO'){toast('Nguồn video minh họa: bản này dùng trình đọc PDF để thử luồng học.')}readerTab='chat';go('reader')}
function openCourse(i){selectedCourse=i;go('course')}function course(){let c=[...courses,...extraCourses][selectedCourse]||courses[0];return '<div class="pagehead"><div><button class="textbtn" style="padding:0;margin-bottom:16px" onclick="go(\'library\')">'+icon('back')+'Góc học tập</button><span class="badge green">Khóa học cá nhân</span><h1 style="margin-top:12px">'+esc(c.title)+'</h1><p>Không cần deadline. Bạn chọn bài muốn học và nhịp học phù hợp.</p></div><button class="btn secondary" onclick="openUpload()">'+icon('plus')+'Thêm nguồn</button></div><div class="tabs"><button class="active">Bài học</button><button onclick="tab=\'sources\';go(\'library\')">Học liệu</button><button onclick="go(\'reader\')">Hỏi AI</button><button onclick="startQuiz()">Luyện tập</button><button onclick="readerTab=\'notes\';go(\'reader\')">Ghi chú</button></div><section class="settingcard" style="margin-bottom:22px"><div class="eyebrow">'+(c.blue?'Chương 1 · Kiến trúc mạng':'Chương 1 · Nền tảng dữ liệu')+'</div><h2 style="font-size:19px;margin-top:12px">'+(c.blue?'Hiểu cách các máy tính kết nối':'Bắt đầu từ những điều cốt lõi')+'</h2><p>Lộ trình mẫu có thể học theo bất kỳ thứ tự nào. Tiến độ mở bài không phải đánh giá mức hiểu.</p></section>'+[c.blue?'Tổng quan về mạng máy tính':'Tổng quan cơ sở dữ liệu',c.blue?'Mô hình OSI và TCP/IP':'Mô hình dữ liệu quan hệ',c.blue?'Địa chỉ IP và chia mạng con':'Khóa và ràng buộc',c.blue?'Định tuyến cơ bản':'Truy vấn SQL cơ bản'].map((t,i)=>'<button class="lessonrow" onclick="go(\'reader\')"><span class="lessonnum">0'+(i+1)+'</span><span><h3>'+t+'</h3><p>'+(i===2?'Bạn đang học · ':'')+'Tài liệu và ví dụ minh họa</p></span>'+icon('chevron')+'</button>').join('')+footer()}
function reader(){return '<div class="pagehead"><div><button class="textbtn" style="padding:0;margin-bottom:12px" onclick="go(\'library\')">'+icon('back')+'Góc học tập</button><h1 style="font-size:21px">Khóa và ràng buộc</h1><p>Bài giảng Cơ sở dữ liệu.pdf · Nội dung minh họa</p></div><button class="btn secondary" onclick="startQuiz()">'+icon('quiz')+'Luyện tập</button></div><div class="reading-switch"><button class="'+(readingView==='document'?'active':'')+'" onclick="readingView=\'document\';render()">'+icon('file')+' Tài liệu</button><button class="'+(readingView==='assistant'?'active':'')+'" onclick="readingView=\'assistant\';render()">'+icon('spark')+' Trợ giảng AI</button></div><div class="readergrid" data-view="'+readingView+'"><section class="reader"><div class="readertools"><span>'+icon('file')+' Bài giảng Cơ sở dữ liệu.pdf</span><span><button aria-label="Trang trước" onclick="changePage(-1)">‹</button> <span id="pageNum">'+readerPage+'</span> / 42 <button aria-label="Trang sau" onclick="changePage(1)">›</button></span></div><article class="paper"><small>CHƯƠNG 02 / MÔ HÌNH DỮ LIỆU QUAN HỆ</small><h2>Khóa và ràng buộc<br>trong cơ sở dữ liệu</h2><p>Trong mô hình quan hệ, các bảng liên kết với nhau thông qua những thuộc tính chung. Khóa giúp xác định bản ghi và giữ cho dữ liệu nhất quán.</p><h3>2.3. Khóa ngoại (Foreign Key)</h3><p><span class="highlight">Khóa ngoại là một hoặc một nhóm thuộc tính tham chiếu đến khóa phù hợp trong một bảng liên quan.</span></p><div class="definition">Ràng buộc toàn vẹn tham chiếu yêu cầu giá trị khóa ngoại khác NULL phải tồn tại trong tập giá trị khóa được tham chiếu.</div><table class="table"><tr><th>Mã sinh viên</th><th>Họ tên</th><th>Mã lớp</th></tr><tr><td>SV001</td><td>Nguyễn Minh Anh</td><td>CNTT01</td></tr><tr><td>SV002</td><td>Trần Thức Tri</td><td>CNTT02</td></tr></table><p><strong>Ví dụ:</strong> Thuộc tính Mã lớp trong bảng Sinh viên có thể tham chiếu đến Mã lớp trong bảng Lớp học.</p><button class="citation" onclick="askPreset(\'Giải thích đoạn được đánh dấu bằng một ví dụ dễ hiểu\')">'+icon('spark')+'Giải thích đoạn này</button><div style="text-align:center;font-size:9px;color:#b1b9ac;margin-top:22px">'+readerPage+' · Tài liệu mô phỏng cho bản giao diện</div></article></section><section class="chatpanel"><div class="chatheader"><div class="aititle"><span class="aiicon">'+icon('spark')+'</span>Trợ giảng AI <span class="badge green" style="margin-left:auto">Minh họa</span></div><div class="chattabs"><button class="'+(readerTab==='chat'?'active':'')+'" onclick="readerTab=\'chat\';render()">Hỏi AI</button><button class="'+(readerTab==='notes'?'active':'')+'" onclick="readerTab=\'notes\';render()">Ghi chú</button></div></div>'+(readerTab==='notes'?'<div style="padding:18px;flex:1"><p style="font-size:11px;color:var(--muted);line-height:1.9">Ghi lại theo cách bạn hiểu. Ghi chú mẫu được lưu trên trình duyệt này.</p><textarea class="notearea" id="noteEditor" aria-label="Nội dung ghi chú">'+esc(note)+'</textarea><button class="btn" onclick="saveNote()">'+icon('check')+'Lưu ghi chú</button></div>':'<div class="chats" id="chats"><div class="msg assistant"><span class="label">'+icon('spark')+' LUMI</span>Mình đang học cùng bạn từ <strong>Bài giảng Cơ sở dữ liệu.pdf</strong>.<br>Bạn muốn mình giải thích đoạn nào?<div class="suggestions"><button onclick="askPreset(\'Khóa ngoại khác khóa chính thế nào?\')">So sánh hai loại khóa</button><button onclick="askPreset(\'Cho mình ví dụ về khóa ngoại\')">Cho mình một ví dụ</button></div></div>'+chatMessages.map(messageHTML).join('')+'</div><div class="chatcompose"><form onsubmit="event.preventDefault();sendChat()"><input id="chatInput" aria-label="Hỏi trợ giảng AI" placeholder="Cứ hỏi điều bạn chưa hiểu..."><button class="btn" aria-label="Gửi câu hỏi" type="submit">'+icon('send')+'</button></form><small>Phản hồi mẫu để thử giao diện · AI thật sẽ được kết nối sau.</small></div>')+'</section></div>'+footer()}
function messageHTML(m){return '<div class="msg '+m.role+'">'+(m.role==='assistant'?'<span class="label">'+icon('spark')+' LUMI · PHẢN HỒI MẪU</span>':'')+esc(m.text).replace(/\n/g,'<br>')+(m.role==='assistant'?'<br><button class="citation" onclick="readerPage=12;render();toast(\'Đã mở trang 12 của nguồn minh họa\')">'+icon('file')+'Bài giảng CSDL · Trang 12</button> <button class="textbtn" style="display:inline-flex" onclick="saveAnswer()">'+icon('note')+'Lưu ghi chú</button>':'')+'</div>'}
function sendChat(value){readingView='assistant';let input=document.getElementById('chatInput');let q=value||(input&&input.value)||'';q=q.trim();if(!q)return;chatMessages.push({role:'user',text:q});let lower=q.toLowerCase();let text=lower.includes('tóm tắt')?'Ba ý chính trong phần tài liệu mẫu:\n1. Khóa chính xác định duy nhất mỗi bản ghi và không NULL.\n2. Khóa ngoại tạo liên kết giữa các bảng.\n3. Toàn vẹn tham chiếu giúp tránh liên kết đến bản ghi không tồn tại.':lower.includes('khác')||lower.includes('so sánh')?'Bạn có thể hình dung như sau:\n\n• Khóa chính: “căn cước” của mỗi bản ghi trong một bảng, phải duy nhất và không NULL.\n• Khóa ngoại: “cầu nối” đến bảng liên quan. Giá trị có thể lặp lại; có được NULL hay không tùy ràng buộc thiết kế.\n\nVí dụ: Mã lớp là khóa chính trong bảng Lớp, còn Mã lớp trong bảng Sinh viên là khóa ngoại.':lower.includes('khóa')||lower.includes('ví dụ')||lower.includes('đoạn')?'Hãy hình dung mỗi lớp có một mã riêng, chẳng hạn CNTT01.\n\nTrong bảng Sinh viên, cột Mã lớp cho biết sinh viên thuộc lớp nào. Cột này tham chiếu đến bảng Lớp nên được gọi là khóa ngoại.\n\nNhờ ràng buộc đó, sinh viên không thể được gán vào một mã lớp chưa tồn tại, nếu không có ngoại lệ theo thiết kế.':'Trong bản giao diện này, mình dùng phản hồi cố định để minh họa. Mình chưa phân tích câu hỏi của bạn bằng AI thật.\n\nBạn có thể thử hỏi về “khóa chính”, “khóa ngoại” hoặc yêu cầu “tóm tắt” để xem các mẫu phản hồi khác nhau.';chatMessages.push({role:'assistant',text});readerTab='chat';if(page!=='reader')go('reader');else render();let c=document.getElementById('chats');if(c)c.scrollTop=c.scrollHeight}
function askPreset(q){readerTab='chat';sendChat(q)}function quickChat(){let v=document.getElementById('quickQuestion').value;if(v.trim())sendChat(v);else go('reader')}function saveAnswer(){let last=[...chatMessages].reverse().find(x=>x.role==='assistant');if(last){note+='\n\n'+last.text;persist('sf-note',note);toast('Đã lưu vào ghi chú trên trình duyệt này.')}}function saveNote(){note=document.getElementById('noteEditor').value;persist('sf-note',note);toast('Đã lưu ghi chú trên trình duyệt này.')}function changePage(d){readerPage=Math.min(42,Math.max(1,readerPage+d));render()}
function startQuiz(){quizIndex=0;answer=null;checked=false;score=0;go('quiz')}function quiz(){if(quizIndex>=questions.length)return '<div class="quizwrap"><div class="quizcard" style="text-align:center;padding:45px 25px"><span class="aiicon" style="width:56px;height:56px;margin:auto">'+icon('sprout')+'</span><div class="eyebrow" style="margin:22px 0 10px">Một bước nhỏ, thêm chút hiểu</div><h2>Bạn đã hoàn thành bài luyện</h2><p style="font-size:13px;color:var(--muted);line-height:1.9">'+score+' / '+questions.length+' câu đúng trong bộ câu hỏi mẫu.<br>Bạn có thể xem lại nguồn hoặc thử thêm lần nữa.</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:25px"><button class="btn" onclick="go(\'reader\')">Xem lại học liệu</button><button class="btn secondary" onclick="startQuiz()">Luyện lại</button></div></div>'+footer()+'</div>';let q=questions[quizIndex];return '<div class="quizwrap"><div class="pagehead"><div><div class="eyebrow">Luyện tập thoải mái</div><h1 style="margin-top:10px">Hiểu thêm qua từng câu</h1><p>Khóa và ràng buộc · Không giới hạn thời gian</p></div><button class="textbtn" onclick="go(\'library\')">Để lúc khác</button></div><div class="progressline" style="margin-bottom:22px"><span style="width:'+(quizIndex/questions.length*100)+'%"></span></div><div class="quizcard"><span class="badge green">Câu '+(quizIndex+1)+' / '+questions.length+'</span><h2>'+q.q+'</h2>'+q.a.map((a,i)=>'<button class="answer '+(answer===i?'selected ':'')+(checked?(i===q.correct?'correct':answer===i?'wrong':''):'')+'" '+(checked?'disabled':'')+' onclick="answer='+i+';render()"><span>'+String.fromCharCode(65+i)+'</span>'+a+'</button>').join('')+(checked?'<div class="feedback"><strong>'+(answer===q.correct?'Bạn đã nắm đúng ý này.':'Mình cùng xem lại một chút nhé.')+'</strong><br>'+q.explain+'<br><button class="citation" onclick="toast(\'Nguồn minh họa: Bài giảng CSDL, trang 12\')">'+icon('file')+'Trang 12 · Bài giảng CSDL</button> <button class="textbtn" style="display:inline-flex" onclick="saveReview()">'+icon('plus')+'Lưu câu này để ôn</button></div>':'')+'<div class="quizactions"><span style="font-size:10px;color:var(--muted)">'+icon('sprout')+' Không cần vội.</span><button class="btn" '+(!checked&&answer===null?'disabled':'')+' onclick="checkQuiz()">'+(checked?(quizIndex===2?'Hoàn thành':'Câu tiếp theo'):'Xem giải thích')+icon('arrow')+'</button></div></div>'+footer()+'</div>'}
function checkQuiz(){if(!checked){if(answer===null)return;if(answer===questions[quizIndex].correct)score++;checked=true}else{quizIndex++;answer=null;checked=false}render()}function saveReview(){let list=saved('sf-review',[]);if(!list.includes(quizIndex))list.push(quizIndex);persist('sf-review',list);toast('Đã lưu câu để ôn. Không tạo lịch hoặc nhắc nhở.')}
function prefRow(ic,color,title,desc,action,value=''){return `<button class="prefrow" onclick="${action}"><span class="preficon" style="--color:${color}">${icon(ic)}</span><span class="preftext"><strong>${title}</strong>${desc?`<small>${desc}</small>`:''}</span>${value?`<span class="prefvalue">${value}</span>`:''}${icon('chevron')}</button>`}
function personal(){let opts=[['planner','Lịch học linh hoạt','Chọn thời gian phù hợp với bạn','clock','#2589f2'],['goals','Mục tiêu theo tuần','Từng bước nhỏ, vừa sức','check','#6d5ee4'],['reminders','Nhắc học nhẹ nhàng','Lựa chọn minh họa trong bản mẫu','sprout','#25ae68'],['flashcards','Ôn flashcard theo lịch','Vẫn có thể ôn tự do khi tắt','quiz','#ee547c'],['focus','Đồng hồ tập trung','Dành một khoảng riêng để học','clock','#ab56d4'],['reports','Tiến độ chi tiết','Nhìn lại điều mình đã học','book','#27a9c0']];return `<div class="pagehead"><div><div class="eyebrow" style="margin-bottom:9px">KHÔNG GIAN CÁ NHÂN</div><h1>Cài đặt</h1><p>Tùy chỉnh trải nghiệm theo cách của bạn.</p></div></div><div class="settings-layout"><nav class="settings-menu" aria-label="Nhóm cài đặt"><button class="active" onclick="document.getElementById('accountSettings').scrollIntoView({behavior:'smooth'})">${icon('user')}Tài khoản</button><button onclick="document.getElementById('studySettings').scrollIntoView({behavior:'smooth'})">${icon('sliders')}Công cụ học tập</button><button onclick="document.getElementById('appSettings').scrollIntoView({behavior:'smooth'})">${icon('settings')}Ứng dụng & dữ liệu</button></nav><div><section class="settings-section" id="accountSettings"><h2 class="group-label">Tài khoản & không gian học tập</h2><div class="settings-group"><button class="prefrow accountrow" onclick="settingsDetail('account')"><span class="avatar">TT</span><span class="preftext"><strong>Thức Tri</strong><small>Sinh viên · Không gian cá nhân</small></span>${icon('chevron')}</button>${prefRow('spark','#f39312','Gói sử dụng','Khám phá trải nghiệm Lumi','settingsDetail(\'plan\')','Bản mẫu')}</div></section><section class="settings-section" id="studySettings"><h2 class="group-label">Công cụ học tập</h2><div class="settings-group">${opts.map(([k,t,d,i,c])=>`<div class="prefrow"><span class="preficon" style="--color:${c}">${icon(i)}</span><span class="preftext"><strong>${t}</strong><small>${d}</small></span><button class="toggle ${tools[k]?'on':''}" role="switch" aria-label="${t}" aria-checked="${!!tools[k]}" onclick="toggleTool('${k}')"><span></span></button></div>`).join('')}</div><p class="setting-note">Bật khi cần, tắt khi muốn. Các công cụ này hoàn toàn tùy chọn.</p></section><section class="settings-section" id="appSettings"><h2 class="group-label">Ứng dụng & dữ liệu</h2><div class="settings-group">${prefRow('palette','#ed3863','Giao diện',themeLabels[currentTheme]+' · Điểm nhấn xanh lá','openAppearance()')}${prefRow('shield','#a54bd0','Quyền riêng tư & dữ liệu','Quản lý dữ liệu trong bản trải nghiệm','settingsDetail(\'privacy\')')}${prefRow('note','#328cde','Xuất ghi chú','','exportNotes()')}${prefRow('help','#24a4c8','Hỗ trợ','','settingsDetail(\'help\')')}${prefRow('info','#7a7e88','Giới thiệu ứng dụng','','settingsDetail(\'about\')','2.0')}</div></section><div class="settings-foot">Lumi · Giao diện 2.0<br>Được thiết kế cho nhịp học của riêng bạn.</div></div></div>`+footer()}
function settingsDetail(kind){if(kind==='appearance'){openAppearance();return}let details={account:['Tài khoản của bạn','<div class="prefrow accountrow"><span class="avatar">TT</span><span class="preftext"><strong>Thức Tri</strong><small>Sinh viên · Hồ sơ minh họa</small></span></div><p>Khi kết nối Supabase, bạn sẽ có thể cập nhật hồ sơ và quản lý đăng nhập tại đây.</p>'],plan:['Một không gian để học','<p>Bạn đang xem bản mẫu thiết kế. Chưa có gói trả phí hay hạn mức tài khoản thật.</p><p>Tài liệu, trợ giảng AI, ghi chú và luyện tập được bố trí cùng một nơi để dễ bắt đầu.</p>'],appearance:['Giao diện & trải nghiệm','<p><strong>Màu tối Graphite</strong> · Điểm nhấn xanh dương.</p><p>Web có không gian làm việc nhiều cột. Điện thoại có điều hướng nổi và chuyển riêng giữa tài liệu với trợ giảng.</p><p>Phông chữ hệ thống hỗ trợ tiếng Việt, icon nét mảnh và các nhóm bo tròn đồng nhất.</p>'],privacy:['Quyền riêng tư & dữ liệu','<p>Bản mẫu chưa đăng nhập hoặc kết nối Supabase. Ghi chú, khóa học tự tạo và lựa chọn công cụ được lưu trong trình duyệt này.</p><p>File được chọn chỉ để minh họa thao tác. Nội dung trong trình đọc là tài liệu mẫu.</p><button class="btn secondary" onclick="exportNotes()">Xuất ghi chú của bạn</button>'],help:['Mình có thể giúp gì?','<p><strong>Bắt đầu học:</strong> Vào Góc học tập, chọn một khóa học hoặc tài liệu.</p><p><strong>Hỏi AI:</strong> Mở tài liệu, chọn Trợ giảng AI rồi gửi câu hỏi. Phản hồi hiện tại là minh họa.</p><p><strong>Trải nghiệm hai bố cục:</strong> Dùng nút Máy tính / Điện thoại ở thanh trên cùng.</p>'],about:['Lumi','<p>Ứng dụng hỗ trợ sinh viên tự học qua tài liệu cá nhân, tích hợp trợ giảng AI.</p><p>Hỏi nhanh → Học sâu → Tùy chọn tổ chức.</p><p>Phiên bản giao diện 2.0 · Bản thiết kế tương tác phục vụ khóa luận tốt nghiệp.</p>']};let d=details[kind];showModal('<h2 id="modalTitle">'+d[0]+'</h2>'+d[1]+'<div class="modalactions"><button class="btn" onclick="closeModal()">Đã hiểu</button></div>')}
function toggleTool(k){tools[k]=!tools[k];persist('sf-tools',tools);render();toast('Đã '+(tools[k]?'bật':'tắt')+' lựa chọn minh họa.')}function exportNotes(){let u=URL.createObjectURL(new Blob([note],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download='Lumi-ghi-chu.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
const themeLabels={light:'Sáng',dark:'Tối',comfort:'Dịu mắt'};
let currentTheme=['light','dark','comfort'].includes(document.documentElement.dataset.theme)?document.documentElement.dataset.theme:'light';
function setTheme(theme){if(!Object.hasOwn(themeLabels,theme))return;currentTheme=theme;document.documentElement.dataset.theme=theme;try{localStorage.setItem('lumi-theme',theme)}catch(e){}const select=document.getElementById('themeSelect');if(select)select.value=theme;const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content={light:'#f7f8fa',dark:'#101115',comfort:'#eeeae2'}[theme];if(page==='personal')render();if(document.getElementById('themeOptions'))renderThemeOptions()}
function themeOptionsHTML(){return ['light','dark','comfort'].map(t=>`<button class="theme-option" role="radio" aria-checked="${currentTheme===t}" onclick="setTheme('${t}')"><div class="theme-swatch ${t}" aria-hidden="true"><div class="swatch-side"></div><div class="swatch-main"><div class="swatch-line"></div><div class="swatch-card"></div><div class="swatch-bar"></div></div></div><strong>${themeLabels[t]} ${currentTheme===t?icon('check'):''}</strong><small>${{light:'Sáng, trong trẻo',dark:'Trầm, nhẹ nhàng',comfort:'Kem ấm, giảm chói'}[t]}</small></button>`).join('')}
function renderThemeOptions(){document.getElementById('themeOptions').innerHTML=themeOptionsHTML();document.getElementById('themeDescription').textContent={light:'Nền trắng và xám sáng, chữ than rõ ràng. Xanh lá nhấn nhẹ ở nút chính và mục đang chọn.',dark:'Nền đen và xám than như bản tham khảo, các nhóm bo tròn có chuyển sắc nhẹ. Xanh lá nhấn ở logo, nút chính và mục đang chọn.',comfort:'Nền be ấm, chữ nâu xám và màu sắc tiết chế. Trang tài liệu dùng giấy ngà để giảm cảm giác chói từ nền trắng.'}[currentTheme]}

function closeModal(){document.getElementById('overlay').innerHTML='';localFile=null}function openUpload(){showModal('<h2 id="modalTitle">Bắt đầu từ một học liệu</h2><p>Không cần tạo khóa học. Bạn có thể thêm tài liệu rồi hỏi ngay.</p><label class="dropzone" for="fileInput">'+icon('file')+'<strong id="fileName">Chọn một file PDF</strong><small>Chọn file để xem luồng giao diện · Chưa tải lên server</small></label><input type="file" id="fileInput" accept="application/pdf,.pdf" hidden onchange="pickFile(this)"><p>File chỉ được chọn trong phiên hiện tại. Nội dung trình đọc vẫn là tài liệu mẫu.</p><div class="modalactions"><button class="btn secondary" onclick="closeModal()">Để sau</button><button class="btn" onclick="addFile()">Thêm vào góc học tập '+icon('arrow')+'</button></div>')}

sourceRows=function(){const list=records.map((r,i)=>({r,i})).filter(({r})=>!r.deleted&&(!searchTerm||r.title.toLowerCase().includes(searchTerm.toLowerCase())));return list.length?`<div class="source-stack">${list.map(({r,i})=>`<div class="managed-source"><button class="source-row" onclick="viewSource(${i})"><div class="fileicon ${r.type==='VIDEO'?'blue':''}">${esc(r.type)}</div><div class="sourceinfo"><strong>${esc(r.title)}</strong><small>${esc(r.meta)} · v${r.version||1}</small></div><span class="ready">${r.status==='ready'?'Sẵn sàng':r.status==='failed'?'Cần thử lại':'Đang xử lý'}</span></button><button class="source-menu" aria-label="Quản lý ${esc(r.title)}" onclick="sourceIndex=${i};go('source')">${icon('sliders')}</button></div>`).join('')}</div>`:empty('Chưa có học liệu phù hợp.',btn('Thêm học liệu','openUpload()'))};

quiz=function(){if(quizIndex>=questions.length)return quizResults();if(quizMode==='practice')return baseQuiz().replace("onclick=\"toast('Nguồn minh họa: Bài giảng CSDL, trang 12')\"","onclick=\"openCitation()\"");const q=questions[quizIndex];return head('Tự kiểm tra',`Câu ${quizIndex+1} / ${questions.length} · Không giới hạn thời gian`)+`<section class="quizcard"><h2>${esc(q.q)}</h2>${q.a.map((a,i)=>`<button class="answer ${answer===i?'selected':''}" onclick="answer=${i};render()"><span>${String.fromCharCode(65+i)}</span>${esc(a)}</button>`).join('')}<div class="quizactions">${btn('Để sau',"go('hub')",true)}${btn(quizIndex===2?'Nộp bài':'Câu tiếp theo','nextTestQuestion()')}</div></section>`};

function flashcardsPage(){const card=cardDeck[flashIndex%Math.max(1,cardDeck.length)];return head('Thẻ ghi nhớ','Ôn tự do bất kỳ lúc nào; lịch ôn là tùy chọn.',btn('Thêm thẻ','editCard()',false,'plus'))+`<div class="actionline">${btn('Tạo bộ thẻ mẫu','generateCards()',true,'spark')}${btn('Tùy chọn lịch ôn',"go('personal')",true)}</div>`+(card?`<section class="flash-panel"><div class="sectiontitle"><span class="badge">Thẻ ${flashIndex%cardDeck.length+1} / ${cardDeck.length}</span><span>${esc(card.due||'Ôn tự do')}</span></div><button class="flash-face" onclick="flipped=!flipped;render()"><span class="eyebrow">${flipped?'CÂU TRẢ LỜI':'TỰ NHỚ TRƯỚC KHI LẬT'}</span><h2>${esc(flipped?card.a:card.q)}</h2><small>${flipped?'Bấm để trở lại câu hỏi':'Bấm để lật thẻ'}</small></button>${flipped?`<p class="setting-note">Bạn nhớ nội dung này thế nào?</p><div class="card-ratings">${[['Chưa nhớ',1],['Hơi khó',2],['Nhớ được',3],['Rất dễ',4]].map(([t,v])=>btn(t,`rateCard(${v})`,true)).join('')}</div>`:btn('Xem câu trả lời','flipped=true;render()')}<div class="actionline">${btn('Thẻ trước','flashIndex=(flashIndex+cardDeck.length-1)%cardDeck.length;flipped=false;render()',true)}${btn('Thẻ sau','flashIndex=(flashIndex+1)%cardDeck.length;flipped=false;render()',true)}${btn('Sửa',`editCard('${card.id}')`,true)}${btn('Xóa',`deleteCard('${card.id}')`,true)}</div></section>`:empty('Chưa có thẻ ghi nhớ.',btn('Tạo thẻ đầu tiên','editCard()')))+footer()}

function plannerPage(){let goal=saved('lumi-week-goal','Hiểu rõ khóa chính và khóa ngoại');return head('Kế hoạch nhẹ nhàng','Tự chọn việc cần làm, không bắt buộc deadline.',btn('Thêm việc','editPlan()',false,'plus'))+`<section class="settingcard"><span class="badge">Mục tiêu của tuần</span><h2 style="margin-top:14px">${esc(goal)}</h2>${btn('Sửa mục tiêu','editGoal()',true)}<p>${plans.filter(p=>p.done).length} / ${plans.length} việc đã hoàn thành</p></section><div class="stack" style="margin-top:18px">${plans.map(p=>`<div class="plan-row settingcard"><button class="task-check ${p.done?'done':''}" aria-label="${p.done?'Bỏ hoàn thành':'Hoàn thành'} ${esc(p.title)}" onclick="togglePlan('${p.id}')">${p.done?icon('check'):''}</button><div class="plan-info"><h3>${esc(p.title)}</h3><p>${esc(p.day)} · ${p.minutes} phút</p></div><div class="actionline">${btn('Sửa',`editPlan('${p.id}')`,true)}${btn('Xóa',`deletePlan('${p.id}')`,true)}</div></div>`).join('')||empty('Bạn chưa đặt việc nào.')}</div><section class="settingcard" style="margin-top:20px"><div class="sectiontitle"><h2>Nhắc học tùy chọn</h2>${btn('Thêm nhắc','editReminder()',true,'plus')}</div><p>Chỉ hiển thị lịch trong bản mẫu; chưa gửi thông báo thiết bị.</p>${reminders.map(r=>`<div class="reminder-row"><span>${esc(r.title)}<small>${esc(r.time)} · ${esc(r.days)} · Asia/Bangkok</small></span><button class="toggle ${r.enabled?'on':''}" role="switch" aria-checked="${r.enabled}" aria-label="Bật nhắc ${esc(r.title)}" onclick="toggleReminder('${r.id}')"><span></span></button>${btn('Xóa',`reminders=reminders.filter(r=>r.id!=='${r.id}');persist('lumi-reminders',reminders);render()`,true)}</div>`).join('')||'<p>Chưa có lịch nhắc.</p>'}</section>`+footer()}
function editGoal(){modalForm('Mục tiêu tuần này',input('Điều bạn muốn hiểu','weekGoal',saved('lumi-week-goal','')),"persist('lumi-week-goal',$('weekGoal').value.trim());closeModal();render()")}
function editPlan(id){let p=plans.find(x=>x.id===id)||{title:'',day:'Thứ hai',minutes:20};modalForm(id?'Sửa việc học':'Thêm việc học',input('Tên việc','planTitle',p.title)+select('Ngày dự kiến','planDay',['Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy','Chủ nhật','Khi rảnh'],p.day)+input('Thời gian dự kiến (phút)','planMinutes',p.minutes,'number'),`storePlan('${id||''}')`)}
function storePlan(id){let title=$('planTitle').value.trim(),minutes=Number($('planMinutes').value);if(!title||minutes<1||minutes>480){toast('Nhập tên việc và thời lượng từ 1–480 phút.');return}let p=plans.find(x=>x.id===id),data={title,minutes,day:$('planDay').value};if(p)Object.assign(p,data);else plans.push({id:uid(),done:false,...data});persist('lumi-plans',plans);closeModal();go('planner')}
function togglePlan(id){let p=plans.find(x=>x.id===id);p.done=!p.done;persist('lumi-plans',plans);render()}
function deletePlan(id){confirmDemo('Xóa việc này?','Mục tiêu tuần và những việc khác vẫn được giữ.',`plans=plans.filter(p=>p.id!=='${id}');persist('lumi-plans',plans);closeModal();render()`)}
function editReminder(){modalForm('Nhắc học nhẹ nhàng',input('Nội dung','reminderTitle','Dành 15 phút ôn bài')+input('Giờ nhắc','reminderTime','20:00','time')+select('Ngày nhắc','reminderDays',['Hằng ngày','Thứ hai, tư, sáu','Cuối tuần']),"const t=$('reminderTitle').value.trim();if(t&&$('reminderTime').value){reminders.push({id:uid(),title:t,time:$('reminderTime').value,days:$('reminderDays').value,enabled:true});persist('lumi-reminders',reminders);closeModal();go('planner')}")}
function toggleReminder(id){let r=reminders.find(x=>x.id===id);r.enabled=!r.enabled;persist('lumi-reminders',reminders);render()}
function focusPage(){return head('Một khoảng để tập trung','Không cần vội. Bạn có thể dừng bất kỳ lúc nào.')+`<section class="focus-card settingcard"><div class="eyebrow">PHIÊN HỌC CỦA BẠN</div><div id="focusClock" class="focus-clock">25:00</div><p id="focusState">${focusRunning?'Đang tập trung':'Sẵn sàng khi bạn muốn'}</p><div class="actionline centered">${[15,25,45].map(n=>btn(n+' phút',`setFocus(${n})`,true)).join('')}</div><div class="actionline centered">${btn(focusRunning?'Tạm dừng':'Bắt đầu','toggleFocus()',false,'play')}${btn('Đặt lại','resetFocus()',true)}${btn('Kết thúc & lưu','finishFocus()',true,'check')}</div><p>Đồng hồ chạy trong trình duyệt, không cần cấp quyền thông báo.</p></section>`+footer()}
function paintTimer(){let el=$('focusClock');if(el)el.textContent=String(Math.floor(focusSeconds/60)).padStart(2,'0')+':'+String(focusSeconds%60).padStart(2,'0')}
function setFocus(n){if(focusTimer)clearInterval(focusTimer);focusRunning=false;focusSeconds=n*60;render()}
function toggleFocus(){if(focusRunning){focusSeconds=Math.max(0,Math.ceil((focusDeadline-Date.now())/1000));focusRunning=false;clearInterval(focusTimer)}else{focusDeadline=Date.now()+focusSeconds*1000;focusRunning=true;focusTimer=setInterval(()=>{focusSeconds=Math.max(0,Math.ceil((focusDeadline-Date.now())/1000));if(focusSeconds===0){focusRunning=false;clearInterval(focusTimer);toast('Phiên tập trung đã kết thúc. Bạn có thể lưu phiên học.')}if(page==='focus')paintTimer()},500)}render()}
function resetFocus(){setFocus(25)}
function finishFocus(){if(focusTimer)clearInterval(focusTimer);focusRunning=false;let log=saved('lumi-focus-sessions',[]);log.unshift({id:uid(),when:new Date().toLocaleString('vi-VN'),remaining:focusSeconds});persist('lumi-focus-sessions',log);focusSeconds=25*60;go('stats');toast('Đã lưu phiên tập trung trên trình duyệt.')}
function statsPage(){const logs=saved('lumi-focus-sessions',[]),reviews=saved('lumi-card-reviews',0);return head('Hành trình học của bạn','Số liệu từ thao tác bạn đã thực hiện trong bản giao diện.')+`<div class="stats-grid">${[[completedLessons.length,'Bài đánh dấu hoàn thành'],[attempts.length,'Bài luyện đã nộp'],[reviews,'Lượt ôn thẻ'],[logs.length,'Phiên tập trung']].map(([n,t])=>`<div class="settingcard stat"><strong>${n}</strong><span>${t}</span></div>`).join('')}</div><div class="two-col" style="margin-top:22px"><section class="settingcard"><h2>Lịch sử luyện tập</h2>${attempts.map(a=>`<div class="result-item"><strong>${a.score} / ${a.total} câu đúng</strong><p>${esc(a.when)}</p>${btn('Xem lại',`showAttempt('${a.id}')`,true)}</div>`).join('')||'<p>Chưa có bài luyện được nộp.</p>'}${btn('Luyện tập','quizSetup()',true)}</section><section class="settingcard"><h2>Phiên tập trung</h2>${logs.map(l=>`<p>${esc(l.when)} · Đã lưu</p>`).join('')||'<p>Chưa có phiên tập trung.</p>'}${btn('Bắt đầu một phiên',"go('focus')",true)}<h2 style="margin-top:25px">Gợi ý tiếp theo</h2><p>${saved('sf-review',[]).length?'Bạn có một vài câu đã lưu để ôn.':'Bạn có thể xem tiếp học liệu hoặc thử một bài luyện ngắn.'}</p>${btn('Mở sổ ôn tập',"go('review')",true)}</section></div>`+footer()}
function showAttempt(id){let a=attempts.find(x=>x.id===id);quizPicked=[...a.picks];score=a.score;quizIndex=questions.length;go('quiz')}
const terms=[['Khóa chính','Một hoặc nhiều thuộc tính xác định duy nhất mỗi bản ghi. Không chứa NULL.'],['Khóa ngoại','Thuộc tính tham chiếu tới khóa phù hợp trong bảng liên quan.'],['Toàn vẹn tham chiếu','Bảo đảm liên kết giữa các bảng giữ được tính nhất quán.'],['Mô hình quan hệ','Biểu diễn dữ liệu bằng các bảng, hàng và cột.']];
let termSearch='';
function glossaryPage(){return head('Thuật ngữ dễ hiểu','Các khái niệm mẫu kèm vị trí trong học liệu.')+`<form class="searchbox glossary-search" onsubmit="event.preventDefault();termSearch=$('termSearch').value;render()">${icon('search')}<input id="termSearch" aria-label="Tìm thuật ngữ" placeholder="Tìm thuật ngữ..." value="${esc(termSearch)}"><button class="textbtn">Tìm</button></form><div class="stack">${terms.filter(([t])=>t.toLowerCase().includes(termSearch.toLowerCase())).map(([t,d])=>`<section class="settingcard"><h2>${t}</h2><p>${d}</p><div class="actionline">${btn('Nguồn · Trang 12','openCitation()',true,'file')}${btn('Hỏi thêm',`askPreset('Giải thích ${t}')`,true)}${btn('Lưu khái niệm',`saveTerm('${t}')`,true)}</div></section>`).join('')||empty('Không tìm thấy thuật ngữ.')}</div>`+footer()}
function saveTerm(t){const term=terms.find(([x])=>x===t);notebooks.unshift({id:uid(),title:term[0],body:term[1],kind:'note',page:12});saveAllNotes();toast('Đã lưu khái niệm vào ghi chú.')}
function outlinesPage(){return head('Đề cương ôn tập','Tóm lược những ý bạn muốn tự kiểm tra.',btn('Tạo đề cương mẫu','newOutline()',false,'plus'))+`<div class="stack">${outlines.map(o=>`<section class="settingcard"><h2>${esc(o.title)}</h2><ul class="outline-list">${o.items.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><div class="actionline">${btn('Chỉnh sửa',`editOutline('${o.id}')`,true)}${btn('Bắt đầu ôn','activeRecall()',true)}${btn('Xóa',`deleteOutline('${o.id}')`,true)}</div></section>`).join('')||empty('Chưa có đề cương.')}</div>`+footer()}
function newOutline(){outlines.unshift({id:uid(),title:'Đề cương ôn tập mới',items:['Khái niệm chính trong bài','Một ví dụ vận dụng','Câu hỏi mình chưa hiểu']});persist('lumi-outlines',outlines);go('outlines')}
function editOutline(id){let o=outlines.find(x=>x.id===id);modalForm('Sửa đề cương',input('Tiêu đề','outlineTitle',o.title)+`<label for="outlineText">Các ý cần ôn (mỗi dòng một ý)</label><textarea id="outlineText" rows="6">${esc(o.items.join('\n'))}</textarea>`,`let o=outlines.find(x=>x.id==='${id}');o.title=$('outlineTitle').value;o.items=$('outlineText').value.split('\\n').filter(x=>x.trim());persist('lumi-outlines',outlines);closeModal();render()`)}
function deleteOutline(id){confirmDemo('Xóa đề cương?','Ghi chú và tài liệu liên quan vẫn được giữ.',`outlines=outlines.filter(x=>x.id!=='${id}');persist('lumi-outlines',outlines);closeModal();render()`)}
function activeRecall(){modalForm('Tự giải thích một chút',`<p>Hãy giải thích khóa ngoại bằng một ví dụ theo cách bạn hiểu.</p><label for="recallText">Câu trả lời của bạn</label><textarea id="recallText" rows="6" required></textarea>`,"recallFeedback()",'Xem phản hồi mẫu')}
function recallFeedback(){const text=$('recallText').value.trim();if(!text)return;showModal(`<h2 id="modalTitle">Cùng xem lại cách hiểu</h2><p class="note-text">${esc(text)}</p><div class="feedback"><strong>Phản hồi minh họa, chưa chấm bằng AI</strong><p>Một lời giải thích rõ nên có: bảng chứa khóa ngoại, bảng được tham chiếu và một ví dụ giá trị liên kết giữa hai bảng.</p></div><div class="modalactions">${btn('Xem nguồn','closeModal();openCitation()',true)}${btn('Thử lại','activeRecall()')}</div>`)}
function authPage(){const isLogin=authMode==='login',reset=authMode==='reset';return head('Tài khoản Lumi','Thử luồng tài khoản bằng dữ liệu mẫu. Không gửi hoặc lưu mật khẩu.')+`<div class="auth-wrap settingcard"><span class="brandmark">${icon('leaf')}</span><h2>${reset?'Khôi phục mật khẩu':isLogin?'Chào mừng bạn trở lại':'Tạo không gian học của bạn'}</h2><form class="lumi-form" onsubmit="event.preventDefault();submitAuth()">${!isLogin&&!reset?input('Tên hiển thị','authName',userProfile.name):''}${input('Email','authEmail',userProfile.email,'email')}${reset?'':input('Mật khẩu (chỉ thử giao diện)','authPassword','','password')}<p class="prototype-banner">Đăng nhập mô phỏng · Không sử dụng mật khẩu tài khoản thật.</p><button class="btn" type="submit">${reset?'Gửi yêu cầu mẫu':isLogin?'Vào Lumi':'Tạo tài khoản mẫu'}</button></form><div class="actionline centered">${btn(isLogin?'Đăng ký':'Đăng nhập',`authMode='${isLogin?'signup':'login'}';render()`,true)}${btn('Quên mật khẩu',"authMode='reset';render()",true)}</div>${btn('Tiếp tục xem bản mẫu',"go('home')",true)}</div>`+footer()}
function submitAuth(){const email=$('authEmail').value.trim();if(!email){toast('Bạn nhập email nhé.');return}if(authMode==='reset'){showModal('<h2 id="modalTitle">Yêu cầu mẫu đã hoàn tất</h2><p>Nếu triển khai thật, hướng dẫn khôi phục sẽ được gửi tới email phù hợp. Bản này không gửi email.</p><div class="modalactions">'+btn('Về đăng nhập',"closeModal();authMode='login';go('auth')")+'</div>');return}if($('authPassword').value.length<6){toast('Nhập ít nhất 6 ký tự để thử luồng.');return}if(authMode==='signup')userProfile.name=$('authName').value.trim()||'Bạn';userProfile.email=email;persist('lumi-profile',userProfile);go('home');toast('Đã vào tài khoản mẫu. Chưa xác thực với máy chủ.')}
function editProfile(){modalForm('Hồ sơ học tập',input('Tên hiển thị','profileName',userProfile.name)+input('Email','profileEmail',userProfile.email,'email')+select('Trình độ tự khai báo','profileLevel',['Sinh viên năm 1','Sinh viên năm 2','Sinh viên năm 3','Sinh viên năm 4','Người tự học'],userProfile.level)+input('Mục tiêu học tập','profileGoal',userProfile.goal)+select('Cách giải thích bạn thích','profileStyle',['Giải thích dễ hiểu','Ngắn gọn, đi thẳng ý','Nhiều ví dụ cụ thể'],userProfile.style),"const name=$('profileName').value.trim();if(name){Object.assign(userProfile,{name,email:$('profileEmail').value,level:$('profileLevel').value,goal:$('profileGoal').value,style:$('profileStyle').value});persist('lumi-profile',userProfile);closeModal();render()}")}

settingsDetail=function(kind){if(kind==='account'){editProfile();return}if(kind==='plan'){quotaDialog();return}if(kind==='privacy'){privacyDialog();return}originalSettingsDetail(kind)};
personal=function(){let h=basePersonal().replace('Thức Tri',esc(userProfile.name)).replace('Sinh viên · Không gian cá nhân',esc(userProfile.level)+' · Không gian cá nhân');const extra=`<section class="settings-section"><h2 class="group-label">Tài khoản & hoạt động</h2><div class="settings-group">${prefRow('user','#408b71','Hồ sơ học tập','Trình độ, mục tiêu, cách giải thích','editProfile()')}${prefRow('clock','#7683b4','Thiết bị & phiên đăng nhập','Xem phiên mẫu và đăng xuất','devicesDialog()')}${prefRow('book','#40879a','Hạn mức & lưu trữ','Theo dõi mức sử dụng minh họa','quotaDialog()')}${prefRow('note','#ba8b5c','Tiến độ học tập','Lịch sử bài luyện và phiên học',"go('stats')")}${prefRow('help','#8c74ab','Góp ý đã lưu','Xem nội dung góp ý trong bản mẫu','feedbackDialog()')}</div></section>`;return h.replace('<div class="settings-foot">',extra+'<div class="settings-foot">')};
function quotaDialog(){showModal(`<h2 id="modalTitle">Hạn mức & lưu trữ</h2><p>Số liệu minh họa để xem thiết kế, chưa phản ánh tài khoản thật.</p>${[['Lượt trợ giảng AI','12 / 100 lượt',12],['Dung lượng nguồn','48 / 500 MB',10],['Thời lượng video','18 / 120 phút',15]].map(([t,v,p])=>`<div class="result-item"><div class="sectiontitle"><strong>${t}</strong><span>${v}</span></div><div class="progressline"><span style="width:${p}%"></span></div></div>`).join('')}<div class="modalactions">${btn('Xong','closeModal()')}</div>`)}
function devicesDialog(){showModal(`<h2 id="modalTitle">Thiết bị & phiên đăng nhập</h2><div class="result-item"><strong>Trình duyệt hiện tại</strong><p>Phiên minh họa · Không đồng bộ máy chủ</p></div><p>Vị trí đọc và dữ liệu mẫu được nhớ trên trình duyệt này.</p><div class="modalactions">${btn('Đóng','closeModal()',true)}${btn('Đăng xuất mẫu',"closeModal();authMode='login';go('auth')")}</div>`)}
function privacyDialog(){showModal(`<h2 id="modalTitle">Dữ liệu của bạn</h2><p>Dữ liệu bạn tạo trong bản mẫu chỉ lưu trong trình duyệt này. Bạn có thể xuất ghi chú và dữ liệu mẫu.</p><div class="actionline">${btn('Xuất ghi chú','exportNotes()',true)}${btn('Xuất dữ liệu mẫu','exportPrototypeData()',true)}</div><p>Xóa dữ liệu mẫu sẽ xóa ghi chú, thẻ, lịch và hội thoại bạn đã tạo ở đây.</p><div class="modalactions">${btn('Đóng','closeModal()',true)}${btn('Xóa dữ liệu mẫu','confirmClearPrototype()')}</div>`)}
exportNotes=function(){let text=notebooks.map(n=>n.title+'\n'+n.body).join('\n\n---\n\n');let url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='Lumi-ghi-chu.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};

function confirmClearPrototype(){confirmDemo('Xóa dữ liệu bản mẫu?','Thao tác này chỉ xóa dữ liệu Lumi và StudyFlow lưu trong trình duyệt. Bạn có thể xuất dữ liệu trước.',"for(const key of Object.keys(localStorage))if(key.startsWith('lumi-')||key.startsWith('sf-'))localStorage.removeItem(key);location.reload()")}
function feedbackDialog(){showModal(`<h2 id="modalTitle">Góp ý đã lưu</h2><p>Góp ý chỉ được lưu tại đây, chưa gửi đến ai.</p>${feedbacks.map(f=>`<div class="result-item"><strong>${esc(f.category)}</strong><p>${esc(f.text)||'Không có mô tả thêm'}</p></div>`).join('')||'<p>Chưa có góp ý. Bạn có thể chọn Báo lỗi trong câu trả lời AI.</p>'}<div class="modalactions">${btn('Xong','closeModal()')}</div>`)}
const transcript=[{s:0,t:'Trong bài này, chúng ta tìm hiểu mô hình mạng OSI.'},{s:65,t:'Mô hình OSI chia hoạt động truyền thông thành bảy tầng.'},{s:125,t:'Tầng mạng chịu trách nhiệm định tuyến và địa chỉ logic.'},{s:185,t:'Tầng giao vận hỗ trợ truyền dữ liệu giữa các ứng dụng.'}];
function timeText(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function videoPage(){return head('Video & transcript','Mô hình OSI · Trình phát và nội dung mô phỏng')+`<div class="video-layout"><section><div class="video-stage"><span class="badge">VIDEO MẪU · KHÔNG PHÁT FILE THẬT</span><span class="video-symbol">${icon('play')}</span><h2>Mô hình OSI</h2><p>Bảy tầng kết nối thế giới</p></div><div class="video-controls"><button class="btn" onclick="videoPlaying=!videoPlaying;render()">${videoPlaying?'Tạm dừng':'Phát mô phỏng'}</button><input aria-label="Vị trí video mẫu" type="range" min="0" max="240" value="${videoTime}" oninput="videoTime=Number(this.value);$('videoPosition').textContent=timeText(videoTime)"><span id="videoPosition">${timeText(videoTime)}</span><span>/ 4:00</span></div><div class="actionline">${btn('Ghi chú tại mốc này',"editVideoNote()",true,'note')}${btn('Hỏi về đoạn này',"askPreset('Giải thích tầng mạng trong mô hình OSI')",true,'spark')}${btn('Lưu vị trí','persistVideoPosition()',true)}</div><section class="settingcard" style="margin-top:16px"><h2>Tóm tắt nội dung</h2><p>Video mẫu giới thiệu các tầng của OSI, đặc biệt tầng mạng và tầng giao vận. Nội dung này chỉ là mẫu để thử điều hướng.</p></section></section><section class="settingcard transcript"><h2>Transcript theo mốc</h2><p>Chọn dòng để chuyển tới vị trí tương ứng.</p>${transcript.map((x,i)=>`<button class="transcript-line ${videoTime>=x.s&&(i===transcript.length-1||videoTime<transcript[i+1].s)?'active':''}" onclick="videoTime=${x.s};render()"><span>${timeText(x.s)}</span><p>${x.t}</p></button>`).join('')}</section></div>`+footer()}
function editVideoNote(){modalForm('Ghi chú tại '+timeText(videoTime),input('Tiêu đề','videoNoteTitle','Ghi chú video '+timeText(videoTime))+`<label for="videoNoteText">Nội dung</label><textarea id="videoNoteText" rows="4" required></textarea>`,"notebooks.unshift({id:uid(),title:$('videoNoteTitle').value,body:'['+timeText(videoTime)+'] '+$('videoNoteText').value,kind:'note',videoTime});saveAllNotes();closeModal();toast('Đã lưu ghi chú theo mốc video.')")}
function persistVideoPosition(){persist('lumi-video-position',videoTime);toast('Đã lưu vị trí video '+timeText(videoTime)+'.')}
setInterval(()=>{if(videoPlaying){videoTime=Math.min(240,videoTime+1);if(videoTime===240)videoPlaying=false;if(page==='video')render()}},1000);
// Restore editable sample courses while keeping prior notes and preferences.
const previousCourses=saved('lumi-default-courses',[]);previousCourses.forEach((c,i)=>{if(courses[i])Object.assign(courses[i],c)});
videoTime=saved('lumi-video-position',125);
const originalThemeRender=renderThemeOptions;
// Header button now states its actual action on both layouts.
const appearanceButton=document.querySelector('.topright .iconbtn');
if(appearanceButton){appearanceButton.classList.add('appearance-trigger');appearanceButton.title='Đổi giao diện';appearanceButton.setAttribute('aria-label','Giao diện: sáng, tối hoặc dịu mắt');appearanceButton.innerHTML=icon('palette')+'<span>Giao diện</span>'}
const sideNav=document.querySelector('.sidebar nav');if(sideNav)sideNav.insertAdjacentHTML('beforeend',`<button class="navitem" data-nav="hub" onclick="go('hub')">${icon('spark')}Chức năng</button>`);
const bottomNav=document.querySelector('.bottomnav');if(bottomNav){const settingsBtn=bottomNav.querySelector('[data-nav="personal"]');if(settingsBtn)settingsBtn.insertAdjacentHTML('beforebegin',`<button data-nav="hub" onclick="go('hub')">${icon('spark')}Chức năng</button>`)}
render();

</script><script>
/* Lumi visual refinement: original interaction and storage functions remain shared. */
let toolCategory=-1,toolQuery='',noteKind='all',planDayFilter='all';
const categoryMeta=[['01','Bắt đầu từ đây','Một không gian cho kiến thức của bạn.','amber'],['02','Đọc, hiểu & khám phá','Đi từ câu hỏi đến điều mình hiểu rõ.','blue'],['03','Luyện một chút, nhớ lâu hơn','Chủ động nhớ lại theo nhịp của bạn.','purple'],['04','Nhịp học của riêng bạn','Chọn những công cụ bạn thấy hữu ích.','green']];
function toneIcon(ic,tone='green'){return `<span class="p-icon ${tone}">${icon(ic)}</span>`}
function polishHeader(title,desc,action='',label='KHÔNG GIAN LUMI'){return `<div class="p-pagehead"><div><span class="eyebrow">${label}</span><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function polishedEmpty(ic,title,text,action){return `<div class="p-empty">${toneIcon(ic,'blue')}<h2>${title}</h2><p>${text}</p>${action}</div>`}
function toolsResults(){let shown=0;const html=featureGroups.map(([title,items],i)=>{if(toolCategory!==-1&&toolCategory!==i)return '';let results=items.filter(([ic,t,d])=>(t+' '+d).toLowerCase().includes(toolQuery.toLowerCase()));if(!results.length)return '';shown+=results.length;const [n,name,desc,tone]=categoryMeta[i];return `<section class="p-tool-section"><div class="p-group-heading"><span class="p-number">${n}</span><div><h2>${name}</h2><p>${desc}</p></div><span class="p-count">${results.length}</span></div><div class="p-tool-grid">${results.map(([ic,t,d,a])=>`<button class="p-tool" onclick="${a}">${toneIcon(ic,tone)}<span class="p-tool-copy"><strong>${t}</strong><small>${d}</small></span><span class="p-tool-arrow">${icon('arrow')}</span></button>`).join('')}</div></section>`}).join('');return shown?html:polishedEmpty('search','Chưa tìm thấy công cụ','Thử một từ khác như “ghi chú”, “thẻ” hoặc “kế hoạch”.',btn('Xem tất cả',"toolQuery='';toolCategory=-1;render()",true))}
hub=function(){return `<div class="p-explore-intro"><div><div class="p-overline"><span class="p-live-dot"></span>KHÔNG GIAN TỰ HỌC</div><h1>Học theo cách<br>của <em>riêng bạn.</em></h1><p>Một nơi để đọc sâu hơn, hỏi tự nhiên hơn<br>và giữ lại những điều mình đã hiểu.</p></div><div class="p-intro-note"><span class="p-mini-label">BẮT ĐẦU THẬT NHẸ</span><div class="p-mini-book">${icon('book')}<span>Một tài liệu.<br>Một điều mới.</span></div><button onclick="openUpload()">Thêm học liệu ${icon('arrow')}</button></div></div><div class="p-spotlights"><button class="p-spotlight ai" onclick="readerTab='chat';readingView='assistant';go('reader')">${toneIcon('spark','green')}<span><small>CÙNG LUMI TÌM HIỂU</small><strong>Điều gì đang làm bạn tò mò?</strong><p>Hỏi từ tài liệu, hiểu bằng ví dụ.</p></span><span class="p-round-arrow">${icon('arrow')}</span></button><button class="p-spotlight review" onclick="go('review')">${toneIcon('quiz','purple')}<span><small>MỘT CHÚT ÔN TẬP</small><strong>Giữ kiến thức ở lại lâu hơn.</strong><p>Flashcard, câu hỏi và những ý cần nhớ.</p></span><span class="p-round-arrow">${icon('arrow')}</span></button></div><div class="p-discovery-bar"><div><h2>Khám phá công cụ</h2><p>Chọn điều hữu ích cho buổi học hôm nay.</p></div><form class="p-search" onsubmit="event.preventDefault()">${icon('search')}<input id="toolSearch" value="${esc(toolQuery)}" aria-label="Tìm chức năng" placeholder="Tìm một công cụ..." oninput="toolQuery=this.value;document.getElementById('toolsResults').innerHTML=toolsResults()"><span>${featureGroups.reduce((n,g)=>n+g[1].length,0)}</span></form></div><nav class="p-category-tabs" aria-label="Nhóm chức năng">${[['Tất cả',-1],['Bắt đầu',0],['Học & hỏi',1],['Luyện & ôn',2],['Tổ chức',3]].map(([t,i])=>`<button class="${toolCategory===i?'active':''}" aria-pressed="${toolCategory===i}" onclick="toolCategory=${i};render()">${t}</button>`).join('')}</nav><div id="toolsResults">${toolsResults()}</div><div class="p-quiet-foot">${icon('sprout')}Không cần dùng tất cả. Chỉ chọn điều hợp với bạn hôm nay.</div>`};
notesPage=function(){const kinds=[['all','Tất cả'],['note','Ghi chú'],['highlight','Đánh dấu'],['question','Câu hỏi'],['saved_answer','Từ Lumi']];const tones={note:'amber',highlight:'green',question:'blue',saved_answer:'purple'};let list=notebooks.filter(n=>noteKind==='all'||n.kind===noteKind);return polishHeader('Những điều muốn giữ lại.','Một ý hiểu, một câu hỏi hay một lời giải thích hữu ích.',btn('Ghi chú mới','editNotebook()',false,'plus'),'SỔ TAY CÁ NHÂN')+`<div class="p-notebook-summary">${toneIcon('note','amber')}<div><strong>${notebooks.length} ghi chú trong không gian của bạn</strong><span>Mỗi ghi chú là một dấu mốc nhỏ của việc học.</span></div>${btn('Xuất ghi chú','exportNotes()',true)}</div><div class="p-category-tabs">${kinds.map(([k,t])=>`<button class="${noteKind===k?'active':''}" onclick="noteKind='${k}';render()">${t} <span>${k==='all'?notebooks.length:notebooks.filter(n=>n.kind===k).length}</span></button>`).join('')}</div>`+(list.length?`<div class="p-notes-grid">${list.map(n=>`<article class="p-note-card ${tones[n.kind]||'amber'}"><div class="p-note-top"><span class="p-note-kind">${icon(n.kind==='saved_answer'?'spark':n.kind==='question'?'help':'note')}${kinds.find(([k])=>k===n.kind)?.[1]||'Ghi chú'}</span><button aria-label="Sửa ${esc(n.title)}" onclick="editNotebook('${n.id}')">${icon('sliders')}</button></div><h2>${esc(n.title)}</h2><p class="note-text">${esc(n.body)}</p><button class="p-note-source" onclick="${n.videoTime!==undefined?`videoTime=${n.videoTime};go('video')`:`readerPage=${n.page||12};readingView='document';readerTab='chat';go('reader')`}">${icon('link')}${n.videoTime!==undefined?'Video · '+timeText(n.videoTime):'Học liệu · Trang '+(n.page||12)}${icon('chevron')}</button><div class="p-note-actions">${btn('Tạo thẻ',`editCard(null,'${n.id}')`,true,'quiz')}${btn('Xóa',`deleteNotebook('${n.id}')`,true)}</div></article>`).join('')}</div>`:polishedEmpty('note','Một trang mới đang chờ.','Bạn có thể ghi lại theo cách mình hiểu, không cần viết thật hoàn hảo.',btn('Thêm ghi chú','editNotebook()')))+footer()};
const oldPlannerPage=plannerPage;
plannerPage=function(){let total=plans.length,done=plans.filter(p=>p.done).length,goal=saved('lumi-week-goal','Hiểu rõ khóa chính và khóa ngoại');let days=['Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy','Chủ nhật'];let visible=plans.filter(p=>planDayFilter==='all'||p.day===planDayFilter);return polishHeader('Dành chỗ cho việc học.','Một kế hoạch vừa sức. Có thể thay đổi bất kỳ lúc nào.',btn('Thêm việc học','editPlan()',false,'plus'),'KẾ HOẠCH CỦA BẠN')+`<div class="p-planner-layout"><section class="p-planner-main"><div class="p-week-strip"><button class="p-week-day ${planDayFilter==='all'?'active':''}" onclick="planDayFilter='all';render()"><small>XEM</small><strong>Tất cả</strong><span>${total}</span></button>${days.map((day,i)=>`<button class="p-week-day ${planDayFilter===day?'active':''}" onclick="planDayFilter='${day}';render()"><small>${i===6?'CN':'T'+(i+2)}</small><strong>${['Hai','Ba','Tư','Năm','Sáu','Bảy','CN'][i]}</strong><span class="${plans.some(p=>p.day===day)?'has-plan':''}">${plans.filter(p=>p.day===day).length||'·'}</span></button>`).join('')}</div><div class="p-group-heading"><div><h2>${planDayFilter==='all'?'Những việc bạn muốn làm':planDayFilter}</h2><p>Hoàn thành từng việc nhỏ, theo nhịp của bạn.</p></div><span class="p-count">${visible.length}</span></div><div class="p-task-list">${visible.map(p=>`<article class="p-task ${p.done?'completed':''}"><button class="task-check ${p.done?'done':''}" aria-label="Đổi trạng thái ${esc(p.title)}" onclick="togglePlan('${p.id}')">${p.done?icon('check'):''}</button><div><h3>${esc(p.title)}</h3><p><span>${esc(p.day)}</span>${icon('clock')}${p.minutes} phút</p></div><button class="p-edit" aria-label="Sửa ${esc(p.title)}" onclick="editPlan('${p.id}')">${icon('sliders')}</button><button class="p-edit" aria-label="Xóa ${esc(p.title)}" onclick="deletePlan('${p.id}')">×</button></article>`).join('')||polishedEmpty('sprout','Một khoảng trống dễ chịu.','Thêm một việc nhỏ khi bạn sẵn sàng.',btn('Thêm việc','editPlan()',true))}</div></section><aside class="p-planner-side"><section class="p-goal-card"><span class="p-mini-label">ĐIỀU MÌNH MUỐN HIỂU</span>${toneIcon('sprout','green')}<h2>${esc(goal)}</h2><div class="p-goal-progress"><span>${done} / ${total} việc hoàn thành</span><strong>${total?Math.round(done/total*100):0}%</strong></div><div class="progressline"><span style="width:${total?done/total*100:0}%"></span></div>${btn('Chỉnh mục tiêu','editGoal()',true)}</section><section class="p-reminder-card"><div class="sectiontitle"><h2>Nhắc mình một chút</h2>${icon('clock')}</div><p>Nhẹ nhàng và hoàn toàn tùy chọn.</p>${reminders.map(r=>`<div class="reminder-row"><span>${esc(r.title)}<small>${esc(r.time)} · ${esc(r.days)}</small></span><button class="toggle ${r.enabled?'on':''}" role="switch" aria-checked="${r.enabled}" aria-label="Bật nhắc ${esc(r.title)}" onclick="toggleReminder('${r.id}')"><span></span></button><button class="p-edit" aria-label="Xóa lịch nhắc" onclick="reminders=reminders.filter(x=>x.id!=='${r.id}');persist('lumi-reminders',reminders);render()">×</button></div>`).join('')||'<div class="p-reminder-empty">Chưa đặt lịch nhắc.<br>Bạn vẫn có thể học tự do.</div>'}${btn('Thêm lịch nhắc','editReminder()',true,'plus')}<small class="p-disclaimer">Lịch nhắc trong bản giao diện, chưa gửi thông báo.</small></section></aside></div>`+footer()};
flashcardsPage=function(){let c=cardDeck[flashIndex%Math.max(1,cardDeck.length)];return polishHeader('Nhớ thêm một chút.','Một câu hỏi mỗi lần. Thử nhớ trước khi lật thẻ.',btn('Tạo thẻ','editCard()',false,'plus'),'GÓC ÔN TẬP')+(c?`<div class="p-flash-layout"><aside class="p-deck-panel"><div class="p-deck-heading">${toneIcon('quiz','purple')}<div><strong>Bộ thẻ của mình</strong><span>${cardDeck.length} thẻ · Ôn tự do</span></div></div><div class="p-deck-list">${cardDeck.map((x,i)=>`<button class="${i===flashIndex%cardDeck.length?'active':''}" onclick="flashIndex=${i};flipped=false;render()"><span>${String(i+1).padStart(2,'0')}</span><strong>${esc(x.q)}</strong></button>`).join('')}</div>${btn('Thêm bộ thẻ mẫu','generateCards()',true,'spark')}</aside><section class="p-study-deck"><div class="p-flash-meta"><span>THẺ ${flashIndex%cardDeck.length+1} / ${cardDeck.length}</span><span>${esc(c.due||'Ôn tự do')}</span></div><div class="p-flash-stack"><button class="flash-face ${flipped?'back':''}" onclick="flipped=!flipped;render()"><span class="p-flash-corner">${icon(flipped?'check':'spark')}</span><span class="eyebrow">${flipped?'MÌNH CÙNG XEM LẠI':'BẠN CÒN NHỚ KHÔNG?'}</span><h2>${esc(flipped?c.a:c.q)}</h2><span class="p-flip-hint">${icon('play')}${flipped?'Bấm để xem lại câu hỏi':'Chạm để lật thẻ'}</span></button></div>${flipped?`<div class="p-rate-section"><p>Bạn nhớ nội dung này thế nào?</p><div class="card-ratings">${[['Chưa nhớ','Thử lại',1],['Hơi khó','Thêm chút nữa',2],['Nhớ được','Tiếp tục nhé',3],['Rất dễ','Bạn đã nắm ý',4]].map(([t,d,n])=>`<button class="p-rating r${n}" onclick="rateCard(${n})"><strong>${t}</strong><small>${d}</small></button>`).join('')}</div></div>`:`<div class="p-flash-prompt">${btn('Lật xem câu trả lời','flipped=true;render()',false,'play')}<p>Không cần đoán đúng ngay lần đầu.</p></div>`}<div class="p-flash-nav">${btn('Trước','flashIndex=(flashIndex+cardDeck.length-1)%cardDeck.length;flipped=false;render()',true,'back')}<div>${btn('Sửa',`editCard('${c.id}')`,true)}${btn('Xóa',`deleteCard('${c.id}')`,true)}</div>${btn('Tiếp','flashIndex=(flashIndex+1)%cardDeck.length;flipped=false;render()',true,'arrow')}</div></section></div>`:polishedEmpty('quiz','Bộ thẻ đầu tiên của bạn.','Biến một ghi chú hay thành câu hỏi để nhớ lâu hơn.',btn('Tạo thẻ','editCard()')))+footer()};
authPage=function(){let login=authMode==='login',reset=authMode==='reset';return `<div class="p-auth-layout"><section class="p-auth-story"><div class="brand"><span class="brandmark">${icon('leaf')}</span>Lumi</div><div><span class="p-mini-label">HỌC NHẸ NHÀNG. HIỂU SÂU HƠN.</span><h1>Một không gian.<br>Nhiều điều<br><em>muốn khám phá.</em></h1><p>Đưa học liệu của bạn vào Lumi.<br>Cùng đọc, cùng hỏi, cùng hiểu thêm.</p><div class="p-auth-stack"><div>${toneIcon('file','amber')}<span><strong>Học liệu của bạn</strong><small>Kiến thức bắt đầu từ đây.</small></span>${icon('check')}</div><div>${toneIcon('spark','green')}<span><strong>Trợ giảng bên cạnh</strong><small>Gỡ rối từng điều chưa rõ.</small></span>${icon('spark')}</div></div></div><small>THEO NHỊP HỌC CỦA RIÊNG BẠN</small></section><section class="p-auth-form"><button class="p-back-link" onclick="go('hub')">${icon('back')}Quay lại không gian học</button><span class="badge">TÀI KHOẢN MẪU</span><h2>${reset?'Tìm lại lối vào.':login?'Mừng bạn trở lại.':'Bắt đầu cùng Lumi.'}</h2><p>${reset?'Nhập email để thử luồng khôi phục mật khẩu.':login?'Một câu hỏi mới đang chờ bạn hôm nay.':'Dành một góc nhỏ cho hành trình học của bạn.'}</p>${!reset?`<div class="p-auth-tabs"><button class="${login?'active':''}" onclick="authMode='login';render()">Đăng nhập</button><button class="${!login?'active':''}" onclick="authMode='signup';render()">Đăng ký</button></div>`:''}<form class="lumi-form" onsubmit="event.preventDefault();submitAuth()">${!login&&!reset?input('Tên của bạn','authName',userProfile.name):''}${input('Email','authEmail',userProfile.email,'email')}${!reset?input('Mật khẩu thử nghiệm','authPassword','','password'):''}${!reset?`<button type="button" class="p-forgot" onclick="authMode='reset';render()">Quên mật khẩu?</button>`:''}<button class="btn" type="submit">${reset?'Tiếp tục':login?'Vào không gian học':'Tạo tài khoản mẫu'}${icon('arrow')}</button></form><div class="p-auth-disclaimer">${icon('info')}Đăng nhập mô phỏng. Không nhập mật khẩu thật.</div>${reset?btn('Về đăng nhập',"authMode='login';render()",true):''}</section></div>`};
historyPage=function(){return polishHeader('Những cuộc trò chuyện.','Mở lại một ý đang tìm hiểu, tiếp tục từ nơi bạn dừng.',btn('Hỏi mới','newConversation()',false,'plus'),'ĐÃ HỎI CÙNG LUMI')+(sessions.length?`<div class="p-conversation-list">${sessions.map(s=>`<article class="p-conversation">${toneIcon('spark','green')}<button class="p-conversation-open" onclick="resumeChat('${s.id}')"><h2>${esc(s.title)}</h2><p>${esc(s.messages.filter(m=>m.role==='assistant').at(-1)?.text.slice(0,130)||'Bắt đầu từ một câu hỏi của bạn.')}</p><div><span>${s.messages.length} tin nhắn</span><span>${s.sources.length} nguồn</span></div></button><div class="p-conversation-actions">${btn('Đổi tên',`renameChat('${s.id}')`,true)}${btn('Xóa',`deleteChat('${s.id}')`,true)}</div></article>`).join('')}</div>`:polishedEmpty('spark','Câu hỏi đầu tiên bắt đầu ở đây.','Một khái niệm khó, một ví dụ cần làm rõ — bạn cứ hỏi.',btn('Trò chuyện cùng Lumi','newConversation()',false,'spark')))+footer()};
const previousSourcePage=sourcePage;
sourcePage=function(){const r=records[sourceIndex];if(!r||r.deleted)return previousSourcePage();const ready=r.status==='ready',failed=r.status==='failed';return polishHeader('Một nguồn, nhiều điều để hiểu.',r.title,btn('Thư viện',"tab='sources';go('library')",true,'back'),'HỌC LIỆU CỦA BẠN')+`<div class="p-source-layout"><section class="p-source-preview"><div class="p-document-art"><span>${r.type}</span><div class="p-art-lines"><i></i><i></i><i></i><i></i><i></i></div>${icon('file')}</div><span class="p-file-label">PHIÊN BẢN ${r.version||1}</span><h2>${esc(r.title)}</h2><p>${esc(r.meta)}</p><span class="p-source-state ${failed?'failed':''}"><i></i>${ready?'Sẵn sàng để khám phá':failed?'Cần xử lý lại':'Đang chuẩn bị học liệu'}</span>${ready?btn('Mở và bắt đầu học',`viewSource(${sourceIndex})`,false,'arrow'):btn(failed?'Thử xử lý lại':'Hoàn tất xử lý mẫu','completeSource()',false,'spark')}<div class="chipline">${(r.tags||[]).map(t=>`<span class="badge">${esc(t)}</span>`).join('')}</div></section><div class="p-source-detail"><section class="p-detail-card"><div class="sectiontitle"><h2>Hành trình của học liệu</h2><span class="badge">${ready?'4 / 4':'1 / 4'}</span></div><div class="p-process-list">${[['Tiếp nhận nguồn','File hoặc nội dung đã được thêm.'],['Đọc và sắp xếp','Trích nội dung theo từng vị trí.'],['Chuẩn bị cho Lumi','Sẵn sàng tìm ý liên quan khi bạn hỏi.'],['Bắt đầu khám phá','Mở học liệu và học theo cách của bạn.']].map(([t,d],i)=>`<div class="p-process-step ${ready||i===0?'done':''}"><span>${ready||i===0?icon('check'):String(i+1).padStart(2,'0')}</span><div><strong>${t}</strong><p>${d}</p></div></div>`).join('')}</div><small class="p-disclaimer">Các bước xử lý đang được mô phỏng trong bản giao diện.</small></section><section class="p-detail-card"><h2>Quản lý học liệu</h2><div class="p-source-actions">${[['note','Đổi tên','renameSource()'],['folder','Gắn thẻ','tagSource()'],['file','Thay phiên bản','replaceSource()'],['spark','Dùng để hỏi','chooseChatSources()']].map(([ic,t,a])=>`<button onclick="${a}">${icon(ic)}${t}${icon('chevron')}</button>`).join('')}</div><div class="p-source-secondary">${btn('Xem tình huống lỗi','simulateSourceFailure()',true)}<button class="p-delete-link" onclick="deleteSource()">Xóa nguồn</button></div></section></div></div>`+footer()};
const previousOutlines=outlinesPage,previousGlossary=glossaryPage,previousStats=statsPage,previousFocus=focusPage;
outlinesPage=function(){return previousOutlines().replaceAll('class="settingcard"','class="settingcard p-outline-card"')};
glossaryPage=function(){return previousGlossary().replaceAll('class="settingcard"','class="settingcard p-term-card"')};
statsPage=function(){return previousStats().replaceAll('class="settingcard stat"','class="settingcard stat p-stat-card"')};
focusPage=function(){return previousFocus().replace('<div id="focusClock" class="focus-clock">','<div class="p-focus-orbit"><div id="focusClock" class="focus-clock">').replace('25:00</div>','25:00</div></div>')};
render();

</script><div id="publicRoot"></div><script>
/* Public presentation, frontend-only session flow and a quieter learner home. */
let lumiGuestMenu=false,landingStep=0,deviceStory='web',pendingLumiRoute='home';
function lumiSession(){try{const s=JSON.parse(sessionStorage.getItem('lumi-demo-session')||'null');return s&&typeof s.email==='string'&&s.expires>Date.now()?s:null}catch{return null}}
function lBrand(){return `<span class="l-logo">${icon('leaf')}</span><span>Lumi<span class="l-logo-dot">.</span></span>`}
function landingPage(){const steps=[['file','Đưa điều bạn muốn học vào Lumi.','Một bản PDF, đoạn văn hay nội dung video có transcript. Không cần tạo khóa học để bắt đầu.','Bài giảng Cơ sở dữ liệu.pdf','42 trang · Tài liệu mẫu'],['spark','Hỏi theo cách bạn thấy tự nhiên.','Một khái niệm chưa rõ, một ví dụ muốn hiểu thêm. Cùng lần theo câu trả lời và vị trí nguồn.','“Khóa ngoại giống một cầu nối?”','Câu hỏi minh họa'],['quiz','Giữ lại điều mình vừa hiểu.','Viết ghi chú bằng lời của mình. Thử một câu hỏi hoặc một tấm thẻ khi muốn ôn lại.','Một chút hiểu thêm, mỗi ngày.','Ghi chú · Luyện tập · Flashcard']];const [ic,title,desc,card,sub]=steps[landingStep];return `<div class="l-landing"><header class="l-nav"><a class="l-brand" href="#landing" aria-label="Lumi trang giới thiệu">${lBrand()}</a><nav aria-label="Điều hướng giới thiệu" class="${lumiGuestMenu?'open':''}"><a href="#" onclick="event.preventDefault();scrollLanding('l-how')">Cách Lumi hoạt động</a><a href="#" onclick="event.preventDefault();scrollLanding('l-devices')">Học ở mọi nơi</a><a href="#" onclick="event.preventDefault();scrollLanding('l-faq')">Câu hỏi thường gặp</a></nav><div class="l-nav-actions"><button class="l-login" onclick="enterLumi('login')">Đăng nhập</button><button class="l-button small" onclick="enterLumi('signup')">Bắt đầu cùng Lumi ${icon('arrow')}</button><button class="l-menu" aria-label="Mở menu giới thiệu" aria-expanded="${lumiGuestMenu}" onclick="toggleGuestMenu()">${icon('sliders')}</button></div></header><main><section class="l-hero"><div class="l-hero-copy"><div class="l-kicker"><i></i>MỘT GÓC RIÊNG CHO VIỆC HỌC</div><h1>Từ “chưa hiểu”…<br>đến <em>“à, ra vậy.”</em></h1><p>Đọc tài liệu, hỏi điều còn vướng và giữ lại những gì vừa hiểu. Lumi ở đây để bạn học theo nhịp của mình.</p><div class="l-hero-actions"><button class="l-button" onclick="enterLumi('signup')">Tạo không gian học ${icon('arrow')}</button><button class="l-text-button" onclick="scrollLanding('l-how')">Khám phá Lumi <span>↓</span></button></div><span class="l-subtle">Không deadline bắt buộc. Không bảng xếp hạng.</span></div><div class="l-hero-scene" aria-label="Minh họa không gian tài liệu và trợ giảng Lumi"><div class="l-scene-top"><span><i></i><i></i><i></i></span><strong>Góc học tập của mình</strong><span>${icon('leaf')}</span></div><div class="l-scene-body"><div class="l-scene-rail">${icon('book')}${icon('note')}${icon('spark')}</div><div class="l-mini-doc"><span class="l-doc-category">CƠ SỞ DỮ LIỆU / 02</span><h2>Một chiếc cầu<br>giữa các bảng.</h2><div class="l-doc-lines"><i></i><i></i><i></i></div><div class="l-doc-highlight">Khóa ngoại giúp kết nối dữ liệu<br>và giữ các mối liên hệ nhất quán.</div><div class="l-doc-table"><span>Sinh viên</span><span>Lớp học</span><i>ma_lop</i><i>ma_lop</i></div><div class="l-doc-page">12 / 42 · Nội dung minh họa</div></div></div><div class="l-scene-chat"><span class="l-chat-symbol">${icon('spark')}</span><div><small>CÙNG LUMI HIỂU THÊM</small><p>Hãy hình dung khóa ngoại như<br>một chiếc cầu nối hai bảng…</p><span>${icon('file')}Bài giảng · Trang 12</span></div></div><div class="l-scene-note">${icon('check')}À, mình hiểu rồi!</div></div></section><section class="l-beliefs" aria-label="Điểm chính"><span>${icon('file')}Bắt đầu từ học liệu của bạn</span><span>${icon('link')}Hỏi đáp có vị trí nguồn</span><span>${icon('sprout')}Công cụ học hoàn toàn tùy chọn</span></section><section id="l-how" class="l-how l-section"><div class="l-section-heading"><span class="l-kicker">MỘT HÀNH TRÌNH NHẸ NHÀNG</span><h2>Không cần biết mọi thứ.<br>Chỉ cần một điều muốn hiểu.</h2></div><div class="l-how-layout"><div class="l-step-tabs" role="tablist" aria-label="Các bước học">${steps.map(([i,t,d],n)=>`<button role="tab" aria-selected="${landingStep===n}" class="${landingStep===n?'active':''}" onclick="landingStep=${n};refreshLandingSection('l-how')"><span>0${n+1}</span><div><strong>${['Mang tài liệu đến','Cùng tìm lời giải','Ghi nhớ theo cách riêng'][n]}</strong><p>${d}</p></div></button>`).join('')}</div><div class="l-step-demo"><span class="l-step-icon">${icon(ic)}</span><span class="l-kicker">${String(landingStep+1).padStart(2,'0')} / 03</span><h3>${title}</h3><div class="l-step-demo-card">${icon(ic)}<div><strong>${card}</strong><span>${sub}</span></div>${icon('check')}</div><span class="l-demo-caption">Minh họa giao diện · Chưa xử lý nguồn hoặc gọi AI thật</span></div></div></section><section class="l-principle"><div><span class="l-kicker">HỌC SÂU, KHÔNG THÊM ÁP LỰC</span><h2>Bạn chọn nhịp.<br>Lumi giữ không gian.</h2></div><div><p>Có hôm bạn chỉ muốn hỏi một câu. Có hôm bạn muốn đi hết một chủ đề. Cả hai đều là một cách học.</p><div class="l-principle-items"><span>${icon('spark')}Hỏi ngay từ một tài liệu</span><span>${icon('book')}Tổ chức thành khóa học khi cần</span><span>${icon('quiz')}Ôn tập khi bạn sẵn sàng</span></div></div></section><section id="l-devices" class="l-section l-devices"><div class="l-device-copy"><span class="l-kicker">Ở NƠI BẠN MUỐN HỌC</span><h2>Màn hình lớn để tập trung.<br>Màn hình nhỏ để tiếp nối.</h2><p>Cùng một hướng thiết kế, được sắp xếp riêng cho máy tính và điện thoại.</p><div class="l-device-tabs" aria-label="Bố cục thiết bị">${[['web','Web & desktop','book'],['mobile','Điện thoại','file']].map(([v,t,i])=>`<button class="${deviceStory===v?'active':''}" aria-pressed="${deviceStory===v}" onclick="deviceStory='${v}';refreshLandingSection('l-devices')">${icon(i)}${t}</button>`).join('')}</div><p class="l-device-detail">${deviceStory==='web'?'Không gian rộng để vừa đọc tài liệu, vừa đặt câu hỏi và ghi lại điều quan trọng.':'Bố cục gọn, chuyển riêng giữa tài liệu và trợ giảng. Dễ học thêm một chút khi rảnh.'}</p><small>Hiện là bản trải nghiệm giao diện trên trình duyệt. Ứng dụng cài đặt và đồng bộ thiết bị chưa được triển khai.</small></div><div class="l-device-preview ${deviceStory}">${deviceStory==='web'?`<div class="l-browser-dots"><i></i><i></i><i></i><span>Lumi / Không gian học</span></div><div class="l-browser-content"><aside>${icon('leaf')}${icon('home')}${icon('book')}${icon('note')}</aside><article><span>HỌC TIẾP MỘT CHÚT</span><h3>Khóa và ràng buộc</h3><p>Mình cùng làm rõ điều còn vướng.</p><div class="l-preview-paper"><i></i><i></i><i></i><b>Khóa chính & khóa ngoại</b><i></i></div></article><div class="l-preview-assistant">${icon('spark')}<strong>Lumi</strong><p>Bạn muốn hiểu thêm điều gì?</p><span>Gửi một câu hỏi…</span></div></div>`:`<div class="l-phone-notch"></div><div class="l-phone-brand">${icon('leaf')}Lumi.</div><small>GÓC HỌC TẬP CỦA BẠN</small><h3>Học tiếp<br>một chút nhé?</h3><div class="l-phone-card">${icon('book')}<strong>Khóa và ràng buộc</strong><span>Tiếp tục từ trang 12 →</span></div><div class="l-phone-shortcuts"><span>${icon('spark')}Hỏi Lumi</span><span>${icon('note')}Ghi chú</span></div><div class="l-phone-bottom">${icon('home')}${icon('book')}${icon('spark')}${icon('user')}</div>`}</div></section><section id="l-faq" class="l-section l-faq"><div><span class="l-kicker">TRƯỚC KHI BẮT ĐẦU</span><h2>Có thể bạn<br>đang thắc mắc.</h2></div><div>${[['Mình có cần tạo khóa học trước không?','Không. Bạn có thể thêm một tài liệu rồi hỏi ngay. Khóa học chỉ hữu ích khi bạn muốn gom nhiều nguồn và học theo một đề cương.'],['Lumi có làm bài thay mình không?','Lumi được thiết kế để giải thích, gợi mở, giúp bạn luyện tập và kiểm tra lại kiến thức qua nguồn. Bạn vẫn là người chủ động suy nghĩ và lựa chọn cách học.'],['Mình có dùng thử trên điện thoại được không?','Có. Bản giao diện có thể mở bằng trình duyệt điện thoại; bên trong còn có nút chuyển bố cục Máy tính / Điện thoại. Chưa có bản tải từ cửa hàng ứng dụng.'],['Đăng nhập và AI đã hoạt động thật chưa?','Chưa. Đây là prototype giao diện. Đăng nhập, xử lý tài liệu và phản hồi AI đang mô phỏng; dữ liệu bạn tạo chỉ lưu tại trình duyệt. Đăng nhập mẫu không tạo tài khoản thật.']].map(([q,a])=>`<details><summary>${q}<span>+</span></summary><p>${a}</p></details>`).join('')}</div></section><section class="l-last-call l-start" aria-labelledby="l-start-title"><div class="l-start-copy"><span class="l-kicker">BẮT ĐẦU HÀNH TRÌNH CÙNG LUMI</span><h2 id="l-start-title">Một nơi để học,<br>hiểu và ghi nhớ.</h2><p>Tập hợp học liệu, làm rõ kiến thức và ôn tập theo cách của bạn. Bắt đầu từ một tài liệu, tiếp nối trên máy tính hoặc điện thoại.</p><div class="l-start-actions"><button class="l-button" onclick="enterLumi('signup')">Tạo không gian học ${icon('arrow')}</button><button class="l-start-mobile" onclick="openLumiMobile()">${icon('play')}Trải nghiệm app mobile</button></div><span class="l-start-caption">Bản trải nghiệm giao diện · Khám phá theo nhịp của bạn</span></div><div class="l-start-journey"><div class="l-start-journey-heading"><span class="l-start-symbol">${icon('leaf')}</span><div><strong>Từ học liệu đến kiến thức</strong><span>Ba bước trong một không gian</span></div></div><ol>${[['file','Thêm học liệu','Tài liệu, văn bản hoặc nội dung video'],['spark','Làm rõ điều chưa hiểu','Hỏi đáp, giải thích và xem lại nguồn'],['quiz','Ghi nhớ kiến thức','Ghi chú, flashcard và bài luyện tập']].map(([i,t,d],n)=>`<li><span class="l-start-number">0${n+1}</span><span class="l-start-step-icon">${icon(i)}</span><div><strong>${t}</strong><span>${d}</span></div></li>`).join('')}</ol><div class="l-start-platforms">${icon('book')}Web & desktop<span></span>${icon('file')}App mobile</div></div></section></main><footer class="l-footer"><a class="l-brand" href="#landing">${lBrand()}</a><span>Học theo nhịp của bạn.</span><div><button onclick="enterLumi('login')">Đăng nhập</button><button onclick="scrollLanding('l-faq')">Thông tin bản trải nghiệm</button></div><div class="l-footer-bottom"><small>Lumi · Bản thiết kế trải nghiệm học tập</small><span class="l-design-credit">Thiết kế bởi <strong>TriThuc</strong></span></div></footer></div>`}
function enterLumi(mode){if(page==='landing')pendingLumiRoute='home';authMode=mode;go('auth')}
function scrollLanding(id){lumiGuestMenu=false;document.querySelector('.l-nav nav')?.classList.remove('open');document.querySelector('.l-menu')?.setAttribute('aria-expanded','false');$(id)?.scrollIntoView({behavior:'smooth',block:'start'})}
function refreshLandingSection(id){const top=window.scrollY;const container=$('publicRoot');container.innerHTML=landingPage();window.scrollTo({top,behavior:'instant'});}
function toggleGuestMenu(){lumiGuestMenu=!lumiGuestMenu;document.querySelector('.l-nav nav')?.classList.toggle('open',lumiGuestMenu);document.querySelector('.l-menu')?.setAttribute('aria-expanded',String(lumiGuestMenu))}
