name: Build Lumi Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build Android APK with Gradle
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle wrapper --gradle-version 8.5
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "❌ Build failed with exit code $STATUS"
            exit $STATUS
          fi

      - name: Upload Debug Log on Failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-log
          name: "Build Failure Debug Log"
          body: "Compilation failed on GitHub Actions. See gradle-build.log attached."
          files: gradle-build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename and Prepare APK
        run: |
          APK_FILE=$(find android/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ No APK file was generated!"
            exit 1
          fi
          echo "✅ Found APK at: $APK_FILE"
          cp "$APK_FILE" Lumi-AI.apk
          ls -lh Lumi-AI.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-Android-APK
          path: Lumi-AI.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-apk
          name: "Lumi AI Android App v1.0.0"
          body: |
            ### 🌿 Bản cài đặt ứng dụng di động Lumi AI (Android APK)
            - **Dành cho:** Điện thoại Android (OPPO A92, Samsung, Xiaomi...)
            - **Tải về:** Bấm vào tệp `Lumi-AI.apk` bên dưới để tải trực tiếp về điện thoại và bấm **Cài đặt**.
          files: Lumi-AI.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
